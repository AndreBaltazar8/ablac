<!doctype html><meta charset="utf-8"><script>
window.ready = (async () => {
  let memory;
  const host = {
    write: (fd, data, length) => { console.log(new TextDecoder().decode(new Uint8Array(memory.buffer, data, length))); return length; },
    exit: (code) => { throw new Error('exit ' + code); },
    clock_ns: () => 0n,
    random: (data, length) => length,
  };
  const { instance } = await WebAssembly.instantiateStreaming(fetch('probe.wasm'), { abla_host: host });
  memory = instance.exports.memory;
  window.probe = instance.exports;
  return 'ready';
})();
</script>
