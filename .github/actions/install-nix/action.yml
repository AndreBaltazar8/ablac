name: Install Nix with a pinned installer
description: >-
  cachix/install-nix-action downloads the Nix installer script from releases.nixos.org over TLS and runs it. The script (a few
  kilobytes) holds the sha256 of the Nix archive it installs, so pinning the script pins every Nix binary. This action fetches the
  script of the Nix version the pinned action installs (nix-2.35.2, from cachix/install-nix-action@13d8dd58 v31), checks it against
  the hash below, and hands that file to the action as install_url. Bump the version and the hash together with the action's pin
  (docs/ci-security.md).
inputs:
  nix_path:
    description: NIX_PATH for the build, as the action's nix_path
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Fetch the Nix installer and check its sha256
      shell: bash
      run: |
        set -euo pipefail
        installer="$RUNNER_TEMP/nix-install-2.35.2"
        curl -fsSL --retry 5 -o "$installer" https://releases.nixos.org/nix/nix-2.35.2/install
        echo "9adda97297d9e8ab360df95c729eabff4f4f93d6db091953c3a68f29e3fb130c  $installer" | sha256sum -c -
        echo "NIX_INSTALLER=$installer" >> "$GITHUB_ENV"
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        install_url: file://${{ env.NIX_INSTALLER }}
        nix_path: ${{ inputs.nix_path }}
