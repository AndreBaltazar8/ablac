# Manual producer for the native AArch64 static compiler archives.
# The maintainer verifies and publishes the checked artifact to the LLVM fork.
name: LLVM AArch64 static archives

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Asset revision for llvm-23.1.3-fdiv-<revision>-aarch64-linux.tar.xz'
        required: true
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Patched LLVM and lld static archives for aarch64-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the patched fork and matching lld
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          test "$(uname -m)" = aarch64
          [[ "$REVISION" =~ ^[1-9][0-9]*$ && "$REVISION" != 1 ]] || { echo 'use a new revision (2 or higher)' >&2; exit 2; }
          nix-build --no-out-link --max-jobs 1 --cores 0 nix/llvm-aarch64-static.nix \
            -A llvm.out -A llvm.lib -A llvm.dev -A lld.out -A lld.lib -A lld.dev > build-llvm.paths
          cat build-llvm.paths
      - name: Verify and pack the AArch64 archives
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          nix-shell -p stdenv.cc binutils nodejs xz --run 'tools/package-llvm-aarch64-static.sh build-llvm.paths'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-aarch64-static
          path: |
            llvm-23.1.3-fdiv-*-aarch64-linux.tar.xz
            llvm-23.1.3-fdiv-*-aarch64-linux.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14
