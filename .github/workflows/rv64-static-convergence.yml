name: RV64 static compiler convergence

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compare:
    name: Compare native RV64 release stages under QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the RV64 static seed from the pinned LLVM SDK
        timeout-minutes: 25
        run: |
          mkdir -p build/ci-logs
          ulimit -S -s 8192
          nix-shell shell.nix --run '
            set -euo pipefail
            deps=$(nix-build --no-out-link nix/riscv64-static-native-deps.nix)
            printf "%s\n" "$deps" > build/ci-logs/rv64-sdk.path
            cp "$deps/SOURCE" build/ci-logs/rv64-sdk-source.txt
            make ablac
            tools/test-static-compiler-riscv64.sh build/ablac "$deps"
          ' 2>&1 | tee build/ci-logs/rv64-static-seed.log
      - name: Build and compare stages 2 and 3
        timeout-minutes: 150
        run: |
          nix-shell shell.nix --run '
            set -euo pipefail
            deps=$(cat build/ci-logs/rv64-sdk.path)
            seed=build/static-compiler-riscv64/ablac-static-riscv64-linux
            shim=build/static-compiler-riscv64/abla_lld_shim.o
            tools/test-rv64-static-convergence.sh "$deps" "$seed" "$shim"
          ' 2>&1 | tee build/ci-logs/rv64-static-convergence.log
      - name: Retain RV64 convergence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rv64-static-convergence
          path: |
            build/ci-logs/
            build/static-compiler-riscv64/*.log
            build/static-compiler-riscv64/compiler.sha256
            build/rv64-static-convergence/run-*/*.log
            build/rv64-static-convergence/run-*/*.time
            build/rv64-static-convergence/run-*/*.sha256
            build/rv64-static-convergence/run-*/*.elf
          if-no-files-found: warn
          retention-days: 14
