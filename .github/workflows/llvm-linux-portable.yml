# Manual producer for the portable Linux toolchain. A maintainer verifies
# and publishes the artifact to the LLVM fork before pinning it in ablac.
name: Patched LLVM for portable Linux

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Asset revision for llvm-23.1.3-fdiv-<revision>-portable-x86_64-linux.tar.xz'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and check the patched LLVM on Ubuntu 22.04
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          mkdir -p out
          docker build -f .github/llvm-portable.Dockerfile -t abla-llvm-portable-build .github
          docker run --rm -e REVISION -e ABLA_SOURCE_SHA="$GITHUB_SHA" \
            -v "$PWD:/abla:ro" -v "$PWD/out:/out" \
            abla-llvm-portable-build /abla/tools/build-portable-linux-llvm.sh "$REVISION" /out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-linux-portable-x86_64
          path: |
            out/*.tar.xz
            out/*.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14
