name: Probe macOS stage 1

# A hang in the pinned bootstrap's native arm64 build of the current sources (ci.yml runs 43588375980 and
# 43594346734, with the pair intrinsic) did not reproduce in the first probe (43601581323). This one runs ci.yml's own
# stage 1 step (foreground, `2>&1 | tee`, its logs directory) three times with the intrinsic ("both") and once without,
# so intermittency shows; a sampler in the same step samples and stops a build that runs past `seconds`.
# Dispatch only; nothing else runs.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds the stage 1 build may run before it is sampled and stopped
        required: false
        default: '420'

jobs:
  probe:
    name: stage 1 (${{ matrix.variant }} ${{ matrix.run }})
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: both, run: 1}
          - {variant: both, run: 2}
          - {variant: both, run: 3}
          - {variant: none, run: 1}
    env:
      JOBS: '2'
      ABLA_NATIVE_JOBS: '2'
      ABLA_CODEGEN_JOBS: '2'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1200'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the bottled native toolchain
        run: |
          brew update
          # Fail rather than compile LLVM from source if a bottle is missing.
          brew install --force-bottle llvm@23 lld@23 openssl@3 binaryen
          {
            echo "$(brew --prefix llvm@23)/bin"
            echo "$(brew --prefix lld@23)/bin"
            echo "$(brew --prefix openssl@3)/bin"
          } >> "$GITHUB_PATH"
      - name: Fetch the checksum-pinned bootstrap
        run: tools/bootstrap-compiler.sh build/ci/bootstrap-ablac
      - name: Apply the variant
        run: |
          case '${{ matrix.variant }}' in
            both) git apply tools/probe/pair-declaration.patch tools/probe/pair-compiler.patch ;;
          esac
          git diff --stat
      - name: Build stage 1 from current sources (ci.yml's step, with a sampler)
        run: |
          tools/probe/sampler.sh '${{ inputs.seconds }}' &
          mkdir -p build/ci-logs
          tools/build-self-hosted-current.sh \
            build/ci/bootstrap-ablac build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-stage1.log
      - name: Keep the samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-stage1-${{ matrix.variant }}-${{ matrix.run }}
          path: |
            build/probe/
            build/ci-logs/
          retention-days: 3
          if-no-files-found: ignore
