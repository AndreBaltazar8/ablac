name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Run a branch by hand before it reaches master.
  workflow_dispatch:
    inputs:
      xtensa_compiler_memory_probe:
        description: Only compare frozen baseline/candidate emit memory with phase traces (no threshold change)
        type: boolean
        required: false
        default: false
      xtensa_companion_embedded_probe:
        description: Only test frozen embedded source and the 4 GiB cap with the installed Linux companion
        type: boolean
        required: false
        default: false
      xtensa_companion_routing_probe:
        description: Only build with stock parent LLVM and test installed Xtensa routing on all three hosts
        type: boolean
        required: false
        default: false
      xtensa_companion_unpublished_fixture:
        description: Installer probe ONLY using hash-pinned UNPUBLISHED dry-run artifacts
        type: boolean
        required: false
        default: false
      xtensa_companion_install_probe:
        description: Only test optional published Xtensa installation on Linux and both Macs
        type: boolean
        required: false
        default: false
      android_pointer_tags_control:
        description: Also prove the tagged-pointer regression fails with the v0.2.47 stdlib
        type: boolean
        required: false
        default: false
      macos_runtime_bench:
        description: Only measure native Mac benchmark runtimes of two releases (default v0.2.45 versus v0.2.47)
        type: boolean
        required: false
        default: false
      macos_runtime_old:
        description: macos_runtime_bench - older release tag (its commit and compiler hash are pinned in tools/bench-macos-runtime.sh)
        type: string
        required: false
        default: v0.2.45
      macos_runtime_new:
        description: macos_runtime_bench - newer release tag
        type: string
        required: false
        default: v0.2.47
      macos_published_rebuild:
        description: Only compare native v0.2.47 rebuilds with both published Mac binaries
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Test the latest state of each PR/master branch without queuing old builds.
# This group is separate from Release and never cancels its gates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    if: ${{ !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control }}
    name: ${{ inputs.xtensa_compiler_memory_probe && 'Xtensa compiler memory probe' || format('Linux suite (shard {0}/3)', matrix.shard) }}
    # Each Linux shard builds the compiler, then runs its partition from tools/test-times.tsv.
    # tools/test-shards.sh checks the partition. The Xtensa memory probe needs just one runner.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.xtensa_compiler_memory_probe && '[1]' || '[1,2,3]') }}
    runs-on: ubuntu-24.04
    # About 29 minutes on a typical runner (2026-11-13); a slow runner is ~1.5x on every test.
    # 2026-11-19: 39, 40, 53 and 40 min on 3376d248, 70483a17, 88510e64, 0baf373f; 4a03e7be hit 60 with 484 tests
    # done (the suite has grown). Until the suite's CPU is cut, 75 leaves room for a slow runner.
    # 2026-11-21: the suite step took 47, 48 and 56 min, then 70 on a slow runner (5830b1a0: all 538 passed, x25519
    # alone 2370 s) and the job hit 75: 90.
    timeout-minutes: 90
    env:
      JOBS: '8'
      ABLA_TEST_JOBS: '1'
      ABLA_NATIVE_JOBS: '1'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      # The runner's processor, cores and memory: 4a03e7be's run took 1.7 times the CPU on every test, shell-only ones
      # too (a slower runner); this says which hardware a run had.
      - name: Record the runner's hardware
        run: |
          lscpu | head -20
          nproc
          free -g
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # nix-shell finds its interactive bash through <nixpkgs>: the pinned one.
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Record the kernel and its file timestamp tick
        run: |
          uname -r
          # Distinct modification times among 200 back-to-back writes: 1 means a coarse clock.
          d=$(mktemp -d); for i in $(seq 200); do echo $i > "$d/f"; stat -c %y "$d/f"; done | sort -u | wc -l
      - name: Build the current compiler from the checksum-pinned bootstrap
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        env:
          ABLA_NATIVE_JOBS: '4'
          ABLA_CODEGEN_JOBS: '4'
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'make ablac' 2>&1 | tee build/ci-logs/linux-build.log
      # The compiler `make ablac` leaves was generated by the pinned bootstrap's
      # backend. The suite judges what the current backend generates (the libc
      # import guard lists the compiler's own imports), so it runs on the
      # compiler built by itself.
      - name: Rebuild the compiler with itself
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        env:
          ABLA_NATIVE_JOBS: '4'
          ABLA_CODEGEN_JOBS: '4'
        run: |
          nix-shell shell.nix --run 'tools/build-self-hosted-release.sh build/ablac.bin build/ci-ablac-stage2 src/orc_main.ab && mv -f build/ci-ablac-stage2 build/ablac.bin' 2>&1 | tee build/ci-logs/linux-stage2.log
      - name: Run native AVX-512 checks when supported
        if: ${{ !inputs.xtensa_compiler_memory_probe && matrix.shard == 1 }}
        run: nix-shell shell.nix --run 'tools/test-simd.sh build/ablac --avx512-only'
      - name: Run WASI commands and the playground worker
        if: ${{ !inputs.xtensa_compiler_memory_probe && matrix.shard == 1 }}
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run '
            wasmtime --version &&
            ABLA_WASMTIME=wasmtime tools/test-wasm-wasi.sh build/ablac &&
            tools/playground/test-run.sh build/ablac
          ' 2>&1 | tee build/ci-logs/wasi.log
      - name: Verify optional Xtensa catalog against published checksums
        if: ${{ !inputs.xtensa_compiler_memory_probe && matrix.shard == 1 }}
        run: nix-shell shell.nix --run 'tools/test-xtensa-catalog.sh build/ablac --published'
      - name: Diagnose frozen compiler emit memory in alternating pairs
        if: inputs.xtensa_compiler_memory_probe
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run 'node tools/probe-xtensa-emit-memory.mjs' 2>&1 | tee build-memory-probe.log
      - name: Retain paired memory samples and raw phase traces
        if: always() && inputs.xtensa_compiler_memory_probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xtensa-emit-memory
          path: |
            build-memory-probe.log
            build/xtensa-emit-memory/*.json
            build/xtensa-emit-memory/*.err
            build/xtensa-emit-memory/*.time
          retention-days: 7
      # The Android tests skip without an NDK and a bionic sysroot, so until now CI never ran them (#811): the arm64
      # library execution test (tools/test-android-run.sh: export enter/leave thunks, emulated TLS, collecting by
      # default) loads a library under bionic's own linker on qemu-aarch64 (qemu-user is in shell.nix), and
      # the link check and the Android extension tests find the NDK too. Both downloads are pinned by checksum
      # (the NDK 664 MB, the arm64 Android 36 system image 810 MB); `make test` below picks them up.
      - name: Fetch the checksum-pinned Android NDK and bionic sysroot
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        run: |
          export PATH="$PATH:/usr/sbin:/sbin"
          command -v debugfs > /dev/null || sudo apt-get install -y --no-install-recommends e2fsprogs
          command -v unzip > /dev/null || sudo apt-get install -y --no-install-recommends unzip
          tools/prepare-android-ndk.sh "$RUNNER_TEMP/android"
          tools/prepare-bionic-sysroot.sh "$RUNNER_TEMP/bionic"
          {
            echo "ABLA_ANDROID_NDK=$RUNNER_TEMP/android/android-ndk-r27c"
            echo "ABLA_BIONIC_ROOT=$RUNNER_TEMP/bionic"
          } >> "$GITHUB_ENV"
      # (The suite builds the x86-64 half of the module programs; the AArch64 half is the libc-free-aarch64 job below.)
      - name: Run the Linux suite
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        env:
          RUN_TESTS_SHARD: ${{ matrix.shard }}/3
          ABLA_DOC_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ $ABLA_DOC_COVERAGE_BASE == 0000000000000000000000000000000000000000 ]]; then
            unset ABLA_DOC_COVERAGE_BASE
          elif [[ -n $ABLA_DOC_COVERAGE_BASE ]] && ! git cat-file -e "$ABLA_DOC_COVERAGE_BASE^{commit}"; then
            git fetch --no-tags --depth=1 origin "$ABLA_DOC_COVERAGE_BASE"
          fi
          # Keep the suite parent at its ordinary stack size; compiler launchers
          # raise their own stack. Large inherited stacks break capped threads.
          ulimit -S -s 8192
          nix-shell shell.nix --run 'make test' 2>&1 | tee build/ci-logs/linux-tests.log
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ci-logs-shard-${{ matrix.shard }}
          path: |
            build/ci-logs/
            build/test-results/
          retention-days: 3
          if-no-files-found: ignore

  # Windows programs (docs/design/windows-target.md, W1a): a freestanding program cross-built on Linux, and run on a Windows
  # runner, which is the truth for the Wine lane of tools/test-windows-link.sh. The Windows job installs no toolchain.
  windows-cross:
    if: ${{ !inputs.xtensa_compiler_memory_probe && !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control }}
    name: Windows programs, cross-built on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the compiler from the checksum-pinned bootstrap
        run: nix-shell shell.nix --run 'make ablac'
      - name: Cross-build the programs and check the link lane
        run: |
          mkdir -p build/windows-programs
          nix-shell shell.nix --run 'build/ablac build tests/cases/windows/exit7.ab --target x86_64-windows -o build/windows-programs/exit7.exe'
          nix-shell shell.nix --run 'build/ablac build tests/cases/windows/crash/crash.ab --target x86_64-windows-hosted -o build/windows-programs/crash.exe'
          nix-shell shell.nix --run 'build/ablac build tests/cases/windows/crash/crash.ab --target x86_64-windows-hosted --backtrace -o build/windows-programs/crash-backtrace.exe'
          nix-shell shell.nix --run 'build/ablac build tests/cases/windows/self.ab --target x86_64-windows-hosted -o build/windows-programs/self.exe'
          for program in fault-guard watchdog preempt; do
            nix-shell shell.nix --run "build/ablac build tests/cases/windows/$program.ab --target x86_64-windows-hosted -o build/windows-programs/$program.exe"
          done
          nix-shell shell.nix --run 'tools/test-windows-link.sh build/ablac'
      # The hosted programs (tests/cases/windows/hosted): built --fast and for release, with the output each prints built natively
      # for Linux; the Windows job runs them (tools/windows/test-hosted.ps1) and compares. `make ablac` is a stage 1 compiler,
      # which cannot build the --fast sockets program (see tools/test-windows-hosted.sh), so that one is left out here.
      - name: Cross-build the hosted programs and their Linux outputs
        run: |
          nix-shell shell.nix --run 'ABLA_WINDOWS_STAGE1=1 tools/test-windows-hosted.sh build/ablac'
          nix-shell shell.nix --run 'tools/test-windows-programs.sh build/ablac'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-programs
          path: |
            build/windows-programs/exit7.exe
            build/windows-programs/crash.exe
            build/windows-programs/crash-backtrace.exe
            build/windows-programs/crash-backtrace.exe.debug
            build/windows-programs/self.exe
            build/windows-programs/fault-guard.exe
            build/windows-programs/watchdog.exe
            build/windows-programs/preempt.exe
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-hosted-programs
          path: |
            build/windows-hosted/*.exe
            build/windows-hosted/*.expected
            build/windows-hosted/SHA256SUMS
          retention-days: 3
      # The standard-library programs of tests/cases/windows/programs.txt, the same way.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-stdlib-programs
          path: |
            build/windows-stdlib/*.exe
            build/windows-stdlib/*.expected
            build/windows-stdlib/*.status
            build/windows-stdlib/SHA256SUMS
          retention-days: 3
      # The --backtrace builds of the programs marked `wine` (they fail on the runner): windows-run prints what happens to them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-debug-programs
          path: |
            build/windows-debug/*.exe
            build/windows-debug/*.exe.debug
          retention-days: 3
          if-no-files-found: ignore

  windows-run:
    needs: windows-cross
    name: Windows programs, run on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: windows-programs
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: windows-hosted-programs
          path: build/windows-hosted
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: windows-stdlib-programs
          path: build/windows-stdlib
      # The seven hosted programs (hello, args, environment, files, process, loopback sockets, threads), --fast and release, each
      # against what the same program printed built natively for Linux; tools/test-windows-hosted.sh runs them under Wine.
      - name: hosted programs print what the Linux programs print
        shell: pwsh
        run: ./tools/windows/test-hosted.ps1 -Programs build/windows-hosted -Arguments one, 'two words', three
      - name: standard-library programs exit and print what the Linux programs do
        shell: pwsh
        run: ./tools/windows/test-hosted.ps1 -Programs build/windows-stdlib -Logs build/windows-stdlib-logs
      # What happens on the runner to the programs marked `wine` in programs.txt (a report; it never fails the job).
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        continue-on-error: true
        with:
          name: windows-debug-programs
          path: build/windows-debug
      - name: wine-only programs, run with --backtrace
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path build/windows-debug) { ./tools/windows/debug-programs.ps1 -Programs build/windows-debug }
      - name: Keep the hosted programs' logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-hosted-logs
          path: |
            build/windows-hosted-logs/
            build/windows-stdlib-logs/
          retention-days: 3
          if-no-files-found: ignore
      - name: exit7.exe exits with status 7
        shell: pwsh
        run: |
          # Print everything a failure to start would say: the pwsh shell ends a step with the last native exit code, so a clean exit 7
          # would also fail it, and a loader error is an exception, not an exit code.
          $ErrorActionPreference = 'Continue'
          $exe = Join-Path $PWD 'exit7.exe'
          "size: $((Get-Item $exe).Length)"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          "first bytes: " + (($bytes[0..63] | ForEach-Object { '{0:x2}' -f $_ }) -join ' ')
          $code = -1
          try {
            $process = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow
            $code = $process.ExitCode
            "exit code: $code"
          } catch {
            "loader error: $($_.Exception.Message)"
          }
          cmd /c "exit7.exe & echo errorlevel=%ERRORLEVEL%"
          $global:LASTEXITCODE = 0
          if ($code -ne 7) {
            Write-Output "exit7.exe exited with $code, not 7"
            exit 1
          }
          exit 0
      # The crash report (tools/test-windows-crash.sh checks it under Wine; this is the truth): a bad store at address 16
      # ends the program with the access violation's status, 0xC0000005, after its vectored exception handler printed the
      # fault line; the --backtrace build's stack names main through the system's unwinder.
      - name: crash.exe store reports the access violation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          foreach ($name in 'crash', 'crash-backtrace') {
            $exe = Join-Path $PWD "$name.exe"
            $process = Start-Process -FilePath $exe -ArgumentList 'store' -Wait -PassThru -NoNewWindow `
              -RedirectStandardError "$name.err" -RedirectStandardOutput "$name.out"
            $code = $process.ExitCode
            $report = Get-Content "$name.err"
            "${name}: exit code $code ($('0x{0:X8}' -f $code))"
            $report | ForEach-Object { "  $_" }
            # ExitCode is the 32-bit status, signed: 0xC0000005 reads -1073741819.
            if ($code -ne -1073741819) { "${name}: not 0xC0000005"; $failed = $true }
            if (-not ($report -contains 'fatal signal: a bad memory access at 0x0000000000000010')) {
              "${name}: no fault line"; $failed = $true
            }
            if ($name -eq 'crash-backtrace' -and -not ($report -match '^0x[0-9a-f]+ in main$')) {
              "${name}: the stack names no main"; $failed = $true
            }
          }
          $global:LASTEXITCODE = 0
          if ($failed) { exit 1 }
          exit 0
      # file:line for that crash, as `ablac symbolize` gives it: the --backtrace program carries no DWARF or symbol
      # table; llvm-symbolizer (the runner's LLVM) follows its debug link to crash-backtrace.exe.debug beside it, at
      # each address less the load address the stack printed, plus the image's preferred base. The bad store is
      # crash.ab line 11.
      - name: crash-backtrace.exe's stack symbolizes to file:line
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $symbolizer = (Get-Command llvm-symbolizer -ErrorAction SilentlyContinue).Source
          if (-not $symbolizer) { $symbolizer = 'C:\Program Files\LLVM\bin\llvm-symbolizer.exe' }
          if (-not (Test-Path $symbolizer)) { 'no llvm-symbolizer on the runner'; exit 1 }
          $exe = Join-Path $PWD 'crash-backtrace.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $header = [BitConverter]::ToInt32($bytes, 60)
          $base = [BitConverter]::ToUInt64($bytes, $header + 48)
          $report = Get-Content 'crash-backtrace.err'
          $load = [Convert]::ToUInt64((($report | Where-Object { $_ -match '^load address 0x' }) -replace '^load address 0x', ''), 16)
          $addresses = $report | Where-Object { $_ -match '^0x[0-9a-f]+ in ' } | ForEach-Object {
            $address = [Convert]::ToUInt64(($_ -split ' ')[0].Substring(2), 16)
            '0x{0:x}' -f ($address - $load + $base)
          }
          "image base $('0x{0:x}' -f $base), load address $('0x{0:x}' -f $load)"
          $symbolized = & $symbolizer "--obj=$exe" --inlining --pretty-print @addresses
          $symbolized | ForEach-Object { "  $_" }
          $global:LASTEXITCODE = 0
          if (-not ($symbolized -match 'crash\.ab:11:')) { 'no crash.ab:11 in the symbolized stack'; exit 1 }
          exit 0
      # What the compiler asks of the runtime before it reaches LLVM (tests/cases/windows/self.ab; tools/test-windows-syscalls.sh
      # checks the same under Wine, which resolves /dev/null by itself): the limits, the CPUs, fchmod, the null device, the float
      # remainder and the program's own path through /proc/self/exe.
      - name: self.exe reads its limits, CPUs, modes, the null device and its own path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $process = Start-Process -FilePath (Join-Path $PWD 'self.exe') -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput 'self.out' -RedirectStandardError 'self.err'
          $lines = Get-Content 'self.out'
          "exit code $($process.ExitCode)"
          $lines | ForEach-Object { "  $_" }
          Get-Content 'self.err' | ForEach-Object { "  stderr: $_" }
          $failed = $process.ExitCode -ne 0
          foreach ($expected in 'remainder 1.5', 'trim 0 key 38', 'stack 8388608 8388608', 'descriptors 4096',
                               'affinity 8 bytes, some CPUs', 'fchmod 0:292 0:420', 'null true 0', 'image exists true',
                               'cpu time true', 'signal mask 0 0', 'ids 0 0 0 0', 'link true [self-link-target.txt] [through]') {
            if (-not ($lines -contains $expected)) { "missing: $expected"; $failed = $true }
          }
          if (-not ($lines -match '^image [A-Za-z]:/([^\\]*/)?self\.exe$')) { 'missing: image <drive>:/.../self.exe'; $failed = $true }
          $global:LASTEXITCODE = 0
          if ($failed) { exit 1 }
          exit 0

      # The compile-time guard's Windows half (docs/design/windows-jit.md §4, §5; tools/test-windows-syscalls.sh checks the same
      # under Wine, whose guard pages, thread suspension and I/O cancellation work differently): fault-guard.exe sends two
      # bad accesses and two stack overflows back to their guard, the second overflow only if the first one's guard page was
      # put back; watchdog.exe stops a thread spinning in executable memory and interrupts its waits; preempt.exe redirects a
      # spinning thread from another and ends a pipe read with CancelSynchronousIo.
      - name: The compile-time guard catches faults, stack overflows and a time limit on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $expected = @{
            'fault-guard' = @('armed 0, JIT fault back with 4, signal 11, address 16', 'own fault back with 4, address 24',
                              'overflow back with 4, signal 11', 'second overflow back with 4, signal 11')
            'watchdog' = @('armed 0', 'spin back with 3', 'runtime sleep -4', 'deferred sleep -4, asked true', 'interpreted read -4',
                           'disarmed sleep 0')
            'preempt' = @('spinning', 'back with 3, watchdog 1', 'interrupted pipe read -4', 'cancelled true')
          }
          $failed = $false
          foreach ($name in 'fault-guard', 'watchdog', 'preempt') {
            $process = Start-Process -FilePath (Join-Path $PWD "$name.exe") -PassThru -NoNewWindow `
              -RedirectStandardOutput "$name.out" -RedirectStandardError "$name.err"
            $null = $process.Handle  # (so ExitCode is kept: Start-Process without -Wait drops it otherwise)
            # A missed stop would wait 30 s sleeps out, or for ever: a minute each, then it counts as failed.
            if (-not $process.WaitForExit(60000)) { $process.Kill(); "${name}: still running after 60 s"; $failed = $true; continue }
            $lines = @(Get-Content "$name.out")
            "${name}: exit code $($process.ExitCode)"
            $lines | ForEach-Object { "  $_" }
            Get-Content "$name.err" | ForEach-Object { "  stderr: $_" }
            if ($process.ExitCode -ne 0) { $failed = $true }
            if (($lines -join "`n") -ne ($expected[$name] -join "`n")) { "${name}: not the expected lines"; $failed = $true }
          }
          $global:LASTEXITCODE = 0
          if ($failed) { exit 1 }
          exit 0

  windows-arm64-cross:
    if: ${{ !inputs.xtensa_compiler_memory_probe && !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control }}
    name: Windows ARM64 programs, cross-built on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the Linux static compiler with LLVM and lld
        run: |
          mkdir -p build/windows-arm64-compiler
          nix-shell shell.nix --run 'set -e; make ablac; static_env=$(tools/static-llvm-env.sh); eval "$static_env"; tools/build-static-compiler.sh build/ablac build/windows-arm64-compiler/ablac' 2>&1 | tee build/windows-arm64-compiler/build.log
      - name: Build and inspect the ARM64 PE programs
        run: |
          nix-shell shell.nix --run 'tools/test-windows-arm64.sh build/windows-arm64-compiler/ablac'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-programs
          path: |
            build/windows-arm64-programs/*.exe
            build/windows-arm64-programs/crash.exe.debug
            build/windows-arm64-programs/files.expected
            build/windows-arm64-programs/SHA256SUMS
          retention-days: 3
      # The standard-library programs of tests/cases/windows/programs.txt, built for ARM64 (the Windows ARM64 runner runs them below). A
      # program that does not build is named in the log and fails this step; the artifact is kept either way.
      - name: Build the standard-library programs for ARM64
        run: nix-shell shell.nix --run 'tools/test-windows-programs.sh build/windows-arm64-compiler/ablac aarch64-windows'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: windows-arm64-stdlib-programs
          path: |
            build/windows-arm64-stdlib/*.exe
            build/windows-arm64-stdlib/*.expected
            build/windows-arm64-stdlib/*.status
            build/windows-arm64-stdlib/SHA256SUMS
          retention-days: 3
          if-no-files-found: ignore
      # The --backtrace builds of the programs in tests/cases/windows/arm64-debug.txt (windows-arm64-run prints what happens to them).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: windows-arm64-debug-programs
          path: |
            build/windows-arm64-debug/*.exe
            build/windows-arm64-debug/*.exe.debug
          retention-days: 3
          if-no-files-found: ignore
      - name: Keep cross-build failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-cross-logs
          path: |
            build/windows-arm64-compiler/build.log
            build/windows-arm64-programs/*.log
            build/windows-arm64-programs/*.pe
            build/windows-arm64-programs/*.unwind
            build/windows-arm64-programs/*.relocations
          retention-days: 3

  windows-arm64-run:
    needs: windows-arm64-cross
    name: Windows ARM64 program runtime
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: windows-arm64-programs
          path: build/windows-arm64-programs
      - name: Check the artifact hashes and run the programs
        shell: pwsh
        run: ./tools/windows/test-arm64.ps1 -Programs build/windows-arm64-programs
      # The standard-library programs, the same list as on x64, run on ARM64: each prints and exits what the Linux program does. All 85
      # passed on the first run with the CPU-probe fix (CI 45560269126; before it https-loopback died of mrs ID_AA64ISAR0_EL1), so a
      # program that differs fails the job.
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: windows-arm64-stdlib-programs
          path: build/windows-arm64-stdlib
      - name: standard-library programs on ARM64 print what the Linux programs print
        shell: pwsh
        run: ./tools/windows/test-hosted.ps1 -Programs build/windows-arm64-stdlib -Logs build/windows-arm64-stdlib-logs
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        continue-on-error: true
        with:
          name: windows-arm64-debug-programs
          path: build/windows-arm64-debug
      - name: ARM64 programs listed in arm64-debug.txt, run with --backtrace
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path build/windows-arm64-debug) { ./tools/windows/debug-programs.ps1 -Programs build/windows-arm64-debug }
      - name: Keep runtime failure logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-runtime-logs
          path: |
            build/windows-arm64-logs/
            build/windows-arm64-stdlib-logs/
          retention-days: 3
          if-no-files-found: ignore

  macos:
    if: ${{ !inputs.xtensa_compiler_memory_probe && !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control }}
    name: ${{ matrix.name }}
    # Each architecture runs host and live tests on parallel runners. Both rebuild stage 2 locally.
    # The Apple Silicon live job also checks iOS and the byte-identical stage-3 self-rebuild.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, name: macOS host tests (Apple Silicon), tests: host, logs: arm64-host}
          - {runner: macos-15, name: macOS host and compiler fixed point, tests: live, logs: arm64}
          - {runner: macos-15-intel, name: macOS host and compiler fixed point (Intel), tests: host, logs: x86_64}
          - {runner: macos-15-intel, name: macOS live compiler tests (Intel), tests: live, logs: x86_64-live}
    runs-on: ${{ matrix.runner }}
    # Intel took 28 min on 89e3a628 and passed 35 on 576a47ef (stage builds and host paths are slower there).
    # The last five green runs took 32 to 38 min (59f5309c 32, a1950bc6 38, 428aff92 35, 681f64fe 33, 5a01101e 36),
    # and 4656d316 hit the old 45-minute limit in its last diagnostic step (18:28:25 after a 17:43:10 start).
    # 2026-11-21: 0ab52763 ran 63 min on a slow Intel runner and hit 60. Every step was 1.5 to 3.3 times its time on
    # 25c21394 and 5830b1a0 (36 min each), the toolchain install (no Abla code) 397 s against 121 and 136, so this
    # was the runner, not growth: 90.
    timeout-minutes: 90
    env:
      JOBS: '2'
      ABLA_NATIVE_JOBS: '2'
      ABLA_CODEGEN_JOBS: '2'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1200'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Record the runner's hardware
        run: sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned patched native LLVM toolchain
        run: tools/install-macos-llvm.sh
      - name: Fetch the checksum-pinned bootstrap
        run: tools/bootstrap-compiler.sh build/ci/bootstrap-ablac
      - name: Build stage 1 from current sources
        run: |
          mkdir -p build/ci-logs
          # Stacks of a build that hangs or crawls (420 s and 900 s in), never stopping it: stage 1 once ran into this
          # step's limit with nothing to show (runs 43588375980, 43594346734).
          tools/sample-slow-build.sh '[b]uild-self-hosted-current' 420 900 &
          tools/build-self-hosted-current.sh \
            build/ci/bootstrap-ablac build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-stage1.log
      - name: Exercise the calls made by BSD system call, one by one (stage 1)
        if: ${{ matrix.tests != 'live' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-darwin-syscalls.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-darwin-syscalls.log
          tools/test-darwin-routines.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-darwin-routines.log
          tools/test-macho-section.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-macho-section.log
          tools/test-heap-stress.sh build/ci/ablac-stage1 180 10 \
            2>&1 | tee build/ci-logs/macos-heap-stress.log
          tools/test-heap-allocator.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-heap-allocator.log
          tools/test-secure-fs.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-secure-fs.log
          tools/test-exec-path.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-exec-path.log
      - name: Build stage 2 with stage 1
        run: |
          set +e
          tools/sample-slow-build.sh '[b]uild-self-hosted-current' 420 900 &
          tools/build-self-hosted-current.sh \
            build/ci/ablac-stage1 build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-stage2.log
          status=${PIPESTATUS[0]}
          echo "stage 2 build exit status: $status"
          exit $status
      - name: Exercise the native macOS host paths
        if: ${{ matrix.tests != 'live' }}
        run: |
          tools/test-macos-host.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-host.log
      # A crash's stack with file:line (atos): a -g program's from its debug map, a --backtrace one's (stripped of it)
      # from the <output>.dSYM its build wrote.
      - name: ablac symbolize (a -g program, and a --backtrace one's .dSYM)
        if: ${{ always() && matrix.tests != 'live' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-symbolize.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-symbolize.log
      # What only ever ran on Linux (#811), each a step of its own that runs whatever failed before it, so one failure
      # does not hide the other answers.
      - name: A dylib entered from threads it did not start (export enter/leave thunks, @hostImport)
        if: ${{ always() && matrix.tests != 'live' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-foreign-threads.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-foreign-threads.log
      - name: "Threads stopped for a collection (stop-the-world: safe points, blocking system calls, a held thread)"
        if: ${{ always() && matrix.tests != 'live' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-gc-threads.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-gc-threads.log
      - name: A thread's stack overflow on its own signal stack (Darwin sigaltstack, the stack guard)
        if: ${{ always() && matrix.tests != 'live' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-runtime-checks.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-runtime-checks.log
      - name: A stop and a stack overflow on a thread a compile-time site starts
        if: ${{ always() && matrix.tests != 'live' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-ct-stop-threads.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-ct-stop-threads.log
      - name: The compiler's emulated TLS for ablac run (100,000 JIT-compiled threads)
        if: ${{ always() && matrix.tests != 'live' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-emutls.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-emutls.log
      # Live mode (`ablac run`, live by default on a Mac too, and `--watch`): both Macs passed it in run 44558971183.
      - name: A live run redefines its functions (ablac run, live by default; liveReload, the refusals)
        if: ${{ always() && matrix.tests != 'host' }}
        # The reload 20 times more: arm64 trapped in a new lambda's call until the registry forward passed its output
        # as sret (runs 44586994389 to 44654107874).
        env:
          ABLA_LIVE_JIT_REPEAT: '20'
        run: |
          mkdir -p build/ci-logs
          tools/test-live-jit.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-live-jit.log
      - name: A --watch run reloads on a save, keeps running after a broken one, restarts after a refused one
        if: ${{ always() && matrix.tests != 'host' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-live-watch.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-live-watch.log
      # `ablac test --watch` on a Mac: both Macs passed it in run 44856754457 (92d97ad8), so it blocks.
      - name: A test --watch run runs again when a file it reads changes, and not for another file
        if: ${{ always() && matrix.tests != 'host' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-test-watch.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-test-watch.log
      # `ablac repl` is a live run on a Mac too: both Macs passed it in run 44837861069, so it blocks.
      - name: A REPL session keeps its state from line to line, contains a panic and refuses a change it cannot take
        if: ${{ always() && matrix.tests != 'host' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-repl.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-repl.log
      # lldb reads a development build's variables (2026-11-21, new): informative until both Macs have passed it.
      - name: A debugger reads a development build's parameters, locals and their Abla types (lldb)
        if: ${{ always() && matrix.tests != 'host' }}
        continue-on-error: true
        run: |
          mkdir -p build/ci-logs
          tools/test-debug-variables.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-debug-variables.log
      # abla-lsp's CI found the released v0.2.68 service dying with SIGBUS on both Macs in a long `analyze --stdio` session (#1207); nothing of
      # ours ran one on a Mac. The session is abla-lsp's compiler-refactors test's own requests (recorded in tests/cases/analysis-service/
      # refactor-session), repeated ten rounds (needs only bash, sed and the compiler; tools/test-analysis-service.sh runs it after its protocol
      # cases on Linux). Blocking on both Macs.
      - name: A long analyze --stdio session (abla-lsp's refactor requests) answers every request and exits 0
        if: ${{ always() && matrix.tests != 'host' }}
        run: |
          mkdir -p build/ci-logs
          tools/test-analysis-refactor-session.sh build/ci/ablac-stage2 10 \
            2>&1 | tee build/ci-logs/macos-analysis-session.log
      # Blocking on both Macs (Intel passed it in every master run from 8945fd39 to 4fe7c105). The compiler's malloc
      # and mutex imports it would catch returning were traced by tools/macos-import-origin.sh, now a manual tool: none
      # is imported since #826.
      - name: Check the libSystem import guard
        if: ${{ always() && matrix.tests != 'live' }}
        run: |
          tools/test-libsystem-imports.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-libsystem-imports.log
      - name: Link iOS slices and exercise an exported C call on Simulator
        if: ${{ matrix.runner == 'macos-15' && matrix.tests == 'live' }}
        run: |
          tools/test-ios-simulator.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/ios-simulator.log
      - name: Check the compiler fixed point and native child
        if: ${{ matrix.runner == 'macos-15' && matrix.tests == 'live' }}
        run: |
          # Builds stage 3, compares both generations' IR, checks the Darwin
          # adapter/object and executes a child built by the rebuilt compiler.
          tools/test-pure-self-rebuild.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-self-rebuild.log
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-ci-logs-${{ matrix.logs }}
          path: |
            build/ci-logs/
            build/probe/
          retention-days: 3
          if-no-files-found: ignore

  macos-published-rebuild:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_published_rebuild }}
    name: v0.2.47 exact rebuild (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1200'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: driver
          persist-credentials: false
      - name: Check out the exact released source in a different directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.2.47
          path: source/independent/location/v0.2.47
          persist-credentials: false
      - name: Install the release's native toolchain
        run: driver/tools/install-macos-repro-toolchain.sh
      - name: Rebuild from the tag's seed and require exact published bytes
        run: >-
          driver/tools/test-macos-published-rebuild.sh
          source/independent/location/v0.2.47
          driver/build/macos-repro/${{ matrix.architecture }}
      - name: Retain raw binaries, objects, provenance and comparison diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-published-rebuild-${{ matrix.architecture }}
          path: |
            driver/build/macos-repro/${{ matrix.architecture }}/
            !driver/build/macos-repro/${{ matrix.architecture }}/cache/
          retention-days: 7
          if-no-files-found: error

  macos-runtime-bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_runtime_bench }}
    name: Native Mac runtime (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: driver
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.macos_runtime_old || 'v0.2.45' }}
          path: source-old
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.macos_runtime_new || 'v0.2.47' }}
          path: source-new
          persist-credentials: false
      - name: Install the native LLVM toolchain
        run: driver/tools/install-macos-repro-toolchain.sh
      - name: Build both releases' programs and measure five alternating runs
        env:
          OLD_TAG: ${{ inputs.macos_runtime_old || 'v0.2.45' }}
          NEW_TAG: ${{ inputs.macos_runtime_new || 'v0.2.47' }}
        run: >-
          driver/tools/bench-macos-runtime.sh source-old source-new
          driver/build/macos-runtime/${{ matrix.architecture }}
          "$OLD_TAG" "$NEW_TAG"
      - name: Retain every sample, binary, output and toolchain version
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-runtime-${{ matrix.architecture }}
          path: |
            driver/build/macos-runtime/${{ matrix.architecture }}/
            !driver/build/macos-runtime/${{ matrix.architecture }}/results/cache/
          retention-days: 14
          if-no-files-found: error

  # Shard the module builds and their QEMU tests together so each runner can reuse its own cross images.
  libc-free-aarch64:
    if: ${{ !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control && !inputs.xtensa_compiler_memory_probe }}
    name: Linux module programs link no libc (AArch64, ${{ matrix.part }}/3)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODULE_PART: ${{ matrix.part }}
      ABLA_TEST_JOBS: '4'
      ABLA_NATIVE_JOBS: '1'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the current compiler from the checksum-pinned bootstrap
        env:
          ABLA_NATIVE_JOBS: '4'
          ABLA_CODEGEN_JOBS: '4'
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'make ablac' 2>&1 | tee build/ci-logs/libc-free-build.log
      # What the check judges is the compiler's own code generation, as in the Linux job: the compiler built by itself.
      - name: Rebuild the compiler with itself
        env:
          ABLA_NATIVE_JOBS: '4'
          ABLA_CODEGEN_JOBS: '4'
        run: |
          nix-shell shell.nix --run 'tools/build-self-hosted-release.sh build/ablac.bin build/ci-ablac-stage2 src/orc_main.ab && mv -f build/ci-ablac-stage2 build/ablac.bin' 2>&1 | tee build/ci-logs/libc-free-stage2.log
      - name: Check the module programs build static for AArch64 Linux
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run 'LIBC_FREE_TARGETS=a64 tools/test-libc-free-programs.sh build/ablac --part "$MODULE_PART/3"' 2>&1 | tee build/ci-logs/linux-libc-free-programs.log
      - name: Compare AArch64 libc-free program results with x86-64
        timeout-minutes: 15
        run: |
          nix-shell shell.nix --run 'tools/test-linux-programs.sh aarch64-linux build/ablac "build/libc-free-programs-part-$MODULE_PART" "$MODULE_PART/3"' 2>&1 | tee build/ci-logs/linux-programs.log
      # Every module program that builds static runs under QEMU and must print and exit what the x86-64 build does (#1208); the blockers
      # are named in tools/linux-parity-blockers.tsv. The step builds the x86-64 reference of each program (--fast) and runs three times.
      - name: Run every AArch64 module program under QEMU and compare with x86-64
        timeout-minutes: 20
        run: |
          nix-shell shell.nix --run 'tools/test-linux-parity.sh aarch64-linux build/ablac "build/libc-free-programs-part-$MODULE_PART" "$MODULE_PART/3"' 2>&1 | tee build/ci-logs/linux-parity.log
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libc-free-aarch64-logs-${{ matrix.part }}
          path: |
            build/ci-logs/
            build/libc-free-programs-part-${{ matrix.part }}/
            build/linux-programs/**/*.log
            build/linux-programs/**/*.out
            build/linux-programs/**/*.err
            build/linux-programs/**/*.status
            build/linux-parity/*/survey/results.tsv
            build/linux-parity/*/survey/runs/*/*.err
            build/linux-parity/*/x86/*.log
          retention-days: 3
          if-no-files-found: ignore

  libc-free-riscv64:
    if: ${{ !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control && !inputs.xtensa_compiler_memory_probe }}
    name: Linux module programs link no libc (RISC-V 64, ${{ matrix.part }}/3)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODULE_PART: ${{ matrix.part }}
      ABLA_TEST_JOBS: '4'
      ABLA_NATIVE_JOBS: '1'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the compiler and rebuild it with itself
        env:
          ABLA_NATIVE_JOBS: '4'
          ABLA_CODEGEN_JOBS: '4'
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'make ablac && tools/build-self-hosted-release.sh build/ablac.bin build/ci-ablac-stage2 src/orc_main.ab && mv -f build/ci-ablac-stage2 build/ablac.bin' 2>&1 | tee build/ci-logs/libc-free-build.log
      - name: Run RISC-V Linux executables under QEMU
        if: ${{ matrix.part == 1 }}
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run 'tools/test-riscv64-linux.sh build/ablac' 2>&1 | tee build/ci-logs/riscv64-linux.log
      - name: Check the module programs build static for RISC-V Linux
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run 'LIBC_FREE_TARGETS=rv64 tools/test-libc-free-programs.sh build/ablac --part "$MODULE_PART/3"' 2>&1 | tee build/ci-logs/linux-libc-free-programs.log
      - name: Compare RISC-V libc-free program results with x86-64
        timeout-minutes: 15
        run: |
          nix-shell shell.nix --run 'tools/test-linux-programs.sh riscv64-linux build/ablac "build/libc-free-programs-part-$MODULE_PART" "$MODULE_PART/3"' 2>&1 | tee build/ci-logs/linux-programs.log
      # Every module program that builds static runs under QEMU and must print and exit what the x86-64 build does (#1208); the blockers
      # are named in tools/linux-parity-blockers.tsv. The step builds the x86-64 reference of each program (--fast) and runs three times.
      - name: Run every RISC-V module program under QEMU and compare with x86-64
        timeout-minutes: 20
        run: |
          nix-shell shell.nix --run 'tools/test-linux-parity.sh riscv64-linux build/ablac "build/libc-free-programs-part-$MODULE_PART" "$MODULE_PART/3"' 2>&1 | tee build/ci-logs/linux-parity.log
      - name: Build the RV64 static compiler and smoke-test it under QEMU
        if: ${{ matrix.part == 1 }}
        env:
          ABLA_NATIVE_JOBS: '4'
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run '
            set -euo pipefail
            deps=$(nix-build --no-out-link nix/riscv64-static-native-deps.nix)
            tools/test-static-compiler-riscv64.sh build/ablac "$deps"
          ' 2>&1 | tee build/ci-logs/static-compiler-riscv64.log
      - name: Keep RV64 static compiler evidence
        if: ${{ always() && matrix.part == 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-compiler-riscv64-logs
          path: |
            build/ci-logs/static-compiler-riscv64.log
            build/static-compiler-riscv64/*.log
            build/static-compiler-riscv64/*.elf
            build/static-compiler-riscv64/*.err
            build/static-compiler-riscv64/*.out
            build/static-compiler-riscv64/compiler.sha256
          retention-days: 3
          if-no-files-found: ignore
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libc-free-riscv64-logs-${{ matrix.part }}
          path: |
            build/ci-logs/
            build/libc-free-programs-part-${{ matrix.part }}/*.log
            build/libc-free-programs-part-${{ matrix.part }}/*.txt
            build/riscv64-linux.*/*.log
            build/linux-programs/**/*.log
            build/linux-programs/**/*.out
            build/linux-programs/**/*.err
            build/linux-programs/**/*.status
            build/linux-parity/*/survey/results.tsv
            build/linux-parity/*/survey/runs/*/*.err
            build/linux-parity/*/x86/*.log
            build/riscv64-linux.*/*.err
            build/riscv64-linux.*/*.out
          retention-days: 3
          if-no-files-found: ignore

  # #806 step C: the statically linked compiler (no loader, no C library) on every push: built by the compiler this commit builds, then
  # no PT_INTERP / DT_NEEDED, a smoke compile, and the fixpoint (it builds itself twice and the two are byte for byte the same). Its LLVM
  # archives come from the pinned nixpkgs (tools/static-llvm-env.sh). The dynamic compiler stays the shipped one.
  static-compiler:
    if: ${{ !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control && !inputs.xtensa_compiler_memory_probe }}
    name: Static compiler (no loader, no libc)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the current compiler from the checksum-pinned bootstrap
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'make ablac' 2>&1 | tee build/ci-logs/static-build.log
      - name: Build the static compiler and check it
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run '
            set -euo pipefail
            eval "$(tools/static-llvm-env.sh)"
            tools/build-static-compiler.sh build/ablac build/ablac-static
            tools/test-static-artifact.sh build/ablac-static
            tools/test-static-lld.sh build/ablac-static
            tools/test-static-wasm-modules.sh build/ablac-static build/ablac
            tools/test-codegen-inprocess.sh build/ablac-static
            tools/test-codegen-cross.sh build/ablac-static
          ' 2>&1 | tee build/ci-logs/static-compiler.log
      - name: Check static codegen archives and cache reuse
        env:
          JOBS: '2'
          RUN_TESTS_FILTER: tools/test-codegen-(units|cache|cache-race)\.sh
          RUN_TESTS_OUTPUT: build/ci-logs/static-codegen
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run 'tools/run-tests.sh build/ablac-static' 2>&1 | tee build/ci-logs/static-codegen.log
          test "$(wc -l < build/ci-logs/static-codegen/results.tsv)" -eq 3
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-compiler-logs
          path: |
            build/ci-logs/
            build/static-artifact/*.log
          retention-days: 3
          if-no-files-found: ignore

  # #806 step C, the second target: the statically linked compiler for aarch64-linux, built by the compiler this commit builds and run under
  # qemu-aarch64 (tools/test-static-compiler-aarch64.sh). Its AArch64 LLVM archives and the target's libstdc++.a, libz.a and libgcc.a come from nixpkgs'
  # native aarch64-linux packages, which cache.nixos.org has built (nix/aarch64-static-native-deps.nix: a download, no build); the cross packages the
  # first version used (pkgsCross.aarch64-multiplatform) are in no cache and built from source in about two hours.
  static-compiler-aarch64:
    if: ${{ !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control && !inputs.xtensa_compiler_memory_probe }}
    name: Static compiler for AArch64 under qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the current compiler from the checksum-pinned bootstrap
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'make ablac' 2>&1 | tee build/ci-logs/static-aarch64-build.log
      - name: Build the AArch64 static compiler and check it under qemu
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run '
            set -euo pipefail
            deps=$(nix-build --no-out-link nix/aarch64-static-native-deps.nix)
            export ABLA_STATIC_LLVM_LIB="$deps/llvm" ABLA_STATIC_TARGET_LIBS="$deps/libs"
            export ABLA_STATIC_LLD_LIB="$deps/lld" ABLA_STATIC_LLD_INCLUDE="$deps/include/lld-only" ABLA_STATIC_LLVM_INCLUDE="$deps/include/llvm" ABLA_STATIC_CXX=clang++ ABLA_STATIC_CXXFLAGS="$(cat "$deps/cxx-flags")"
            STATIC_AARCH64_MODULES=1 tools/test-static-compiler-aarch64.sh build/ablac
          ' 2>&1 | tee build/ci-logs/static-compiler-aarch64.log
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-compiler-aarch64-logs
          path: |
            build/ci-logs/
            build/static-compiler-aarch64/*.log
            build/libc-free-programs/*.log
            build/libc-free-programs/*.txt
          retention-days: 3
          if-no-files-found: ignore

  android-pointer-tags-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_pointer_tags_control }}
    name: AArch64 tagged-pointer positive and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JOBS: '4'
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Fetch the pinned compiler (runtime-only source change)
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'tools/bootstrap-compiler.sh build/pointer-bootstrap.bin'
      - name: Fetch the tagged-pointer negative-control stdlib
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.2.47
          path: build/tagged-pointer-baseline
          persist-credentials: false
      - name: Prove tagged-pointer positive and released-stdlib negative controls
        run: |
          ABLA_SYSROOT="$PWD" nix-shell shell.nix --run 'tools/test-android-pointer-tags.sh build/pointer-bootstrap.bin' \
            > build/ci-logs/pointer-tags-positive.log 2>&1
          if ABLA_SYSROOT="$PWD/build/tagged-pointer-baseline" \
            ABLA_TAGGED_POINTERS_OUT="$PWD/build/tagged-pointer-negative" \
            nix-shell shell.nix --run 'tools/test-android-pointer-tags.sh build/pointer-bootstrap.bin' \
            > build/ci-logs/pointer-tags-negative.log 2>&1; then
            echo 'released stdlib unexpectedly passed tagged-pointer regression' >&2
            exit 1
          fi
          # Require the specific old refusals, not an arbitrary build/emulator failure.
          grep -q 'FAIL tls-release: exit 11' build/ci-logs/pointer-tags-negative.log
          grep -q 'FAIL pages-release: exit 24' build/ci-logs/pointer-tags-negative.log
          grep -q 'FAIL rsa-release: exit 41' build/ci-logs/pointer-tags-negative.log
          grep -q 'FAIL descriptor-release: exit 133' build/ci-logs/pointer-tags-negative.log
          cat build/ci-logs/pointer-tags-positive.log
          cat build/ci-logs/pointer-tags-negative.log
      - name: Keep probe logs and generated objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-pointer-tags-control
          path: |
            build/ci-logs/
            build/android-pointer-tags/
            build/tagged-pointer-negative/
          retention-days: 7
          if-no-files-found: ignore

  xtensa-companion-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.xtensa_companion_install_probe }}
    name: Optional Xtensa installer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: x86_64-linux}
          - {runner: macos-15, platform: arm64-macos}
          - {runner: macos-15-intel, platform: x86_64-macos}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch explicitly UNPUBLISHED dry-run test input
        if: inputs.xtensa_companion_unpublished_fixture
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          repository: AndreBaltazar8/llvm-project
          run-id: '42214578962'
          name: companion-${{ matrix.platform }}
          github-token: ${{ github.token }}
          path: build/UNPUBLISHED-cohort
      - name: Install native build dependencies on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [[ '${{ matrix.platform }}' == x86_64-macos ]]; then
            # Homebrew no longer bottles newer LLVM 23 patches for Intel Macs.
            # Install its checksum-pinned 23.1.0 Sonoma bottles instead of
            # compiling LLVM and its build dependencies from source.
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
            export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
            for formula in openssl@3 zstd z3 binaryen; do
              if ! brew list --versions "$formula" >/dev/null 2>&1; then
                brew install --force-bottle "$formula"
              fi
            done
            install_bottle() {
              local formula=$1 checksum=$2 token bottle
              bottle="$RUNNER_TEMP/$formula--23.1.0.sonoma.bottle.tar.gz"
              token=$(curl -fsSL --retry 3 \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:homebrew/core/$formula:pull" |
                sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
              curl -fL --retry 3 -H "Authorization: Bearer $token" \
                "https://ghcr.io/v2/homebrew/core/$formula/blobs/sha256:$checksum" -o "$bottle"
              printf '%s  %s\n' "$checksum" "$bottle" | shasum -a 256 --check
              # Runner images disable local package paths by default; this
              # official bottle has just passed its pinned checksum check.
              env -u HOMEBREW_FORBID_PACKAGES_FROM_PATHS HOMEBREW_DEVELOPER=1 \
                brew install --ignore-dependencies "$bottle"
            }
            # homebrew-core: llvm 451e4146974a; lld 4c53d1f9e8fe.
            install_bottle llvm 0b0168dc611a9d77aaa62d094178297f8a861d647cc59c43a5dc3f76bd6eb7b2
            install_bottle lld c8affeb82959e53875d13cd58bc459f75863f17e3d4ad68d4ca939a104fd18d5
            prefix=$(brew --prefix)
            ln -sfn "$prefix/opt/llvm" "$prefix/opt/llvm@23"
            ln -sfn "$prefix/opt/lld" "$prefix/opt/lld@23"
            test "$("$prefix/opt/llvm@23/bin/llvm-config" --version)" = 23.1.0
            "$prefix/opt/lld@23/bin/wasm-ld" --version
          else
            # Runner images can carry formula metadata from before LLVM 23.
            brew update
            brew install llvm@23 lld@23 openssl@3 binaryen
          fi
          echo "$(brew --prefix)/opt/llvm@23/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/lld@23/bin" >> "$GITHUB_PATH"
      - name: Install native build dependencies on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf libssl-dev gcc libc6-dev
      - name: Build the native candidate with the pinned published compiler
        run: tools/build-xtensa-native-probe-package.sh
      - name: Native catalog negatives and published checksum check
        env:
          UNPUBLISHED_FIXTURE: ${{ inputs.xtensa_companion_unpublished_fixture }}
        run: |
          compiler="$(find build/native-probe-package/unpacked -path '*/libexec/ablac.bin' -type f -print -quit)"
          catalog_mode=--published
          if [[ $UNPUBLISHED_FIXTURE == true ]]; then catalog_mode=; fi
          tools/test-xtensa-catalog.sh "$compiler" $catalog_mode
          tools/test-xtensa-native.sh "$compiler"
          tools/test-xtensa-companion-offline.sh "$compiler"
          node tests/cases/xtensa-install-probe/report-test.mjs
      - name: Install into the published parent without replacing its LLVM or Clang
        env:
          USE_UNPUBLISHED: ${{ inputs.xtensa_companion_unpublished_fixture }}
        run: |
          if [[ "$USE_UNPUBLISHED" == true ]]; then
            node tools/test-xtensa-installed.mjs build/xtensa-installed --native-package build/native-probe-package/candidate.tar.gz \
              --unpublished-fixture tools/fixtures/xtensa-companion-unpublished.json \
              --archive "$(find build/UNPUBLISHED-cohort -maxdepth 1 -name '*.tar.gz' -print)"
          else
            node tools/test-xtensa-installed.mjs build/xtensa-installed --native-package build/native-probe-package/candidate.tar.gz
          fi
      - name: Retain exact codegen and installation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xtensa-installed-${{ matrix.runner }}-native
          path: |
            build/xtensa-installed/result.json
            build/xtensa-installed/tamper-negative.txt
            build/xtensa-installed/*.s
            build/xtensa-installed/*.o
          retention-days: 7
          if-no-files-found: ignore

  xtensa-companion-install-report:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.xtensa_companion_install_probe }}
    needs: xtensa-companion-install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: xtensa-installed-*
          path: build/xtensa-install-results
      - name: Validate the native installer on all three hosts
        run: node tools/report-xtensa-install-probe.mjs build/xtensa-install-results build/xtensa-install-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: xtensa-installed-comparison
          path: build/xtensa-install-comparison.json
          retention-days: 7
          if-no-files-found: warn

  xtensa-companion-routing:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.xtensa_companion_routing_probe || inputs.xtensa_companion_embedded_probe) }}
    name: Stock parent Xtensa routing (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.xtensa_companion_embedded_probe && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the frozen public embedded gate
        if: inputs.xtensa_companion_embedded_probe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: AndreBaltazar8/abla-embedded
          ref: da5a939a4b0a20a7f97fb58494e3eac7ec4bc7ff
          path: build/xtensa-embedded-source
          persist-credentials: false
      - name: Install the pinned patched Mac LLVM, never build LLVM from source
        if: runner.os == 'macOS'
        run: tools/install-macos-llvm.sh
      - name: Build and exercise the real installed Mac compiler
        if: runner.os == 'macOS'
        run: tools/test-xtensa-stock-toolchain.sh 2>&1 | tee build-routing.log
      - name: Build and exercise the real installed Linux compiler with its published bootstrap
        if: runner.os == 'Linux'
        env:
          EMBEDDED_GATE: ${{ inputs.xtensa_companion_embedded_probe }}
        run: |
          docker run --rm -v "$PWD:/abla" -w /abla -e GITHUB_ACTIONS=true \
            -e ABLA_XTENSA_EMBEDDED_GATE="$EMBEDDED_GATE" \
