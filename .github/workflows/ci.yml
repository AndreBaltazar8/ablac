name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Run a branch by hand before it reaches master.
  workflow_dispatch:
    inputs:
      xtensa_compiler_memory_probe:
        description: Only compare frozen baseline/candidate emit memory with phase traces (no threshold change)
        type: boolean
        required: false
        default: false
      xtensa_companion_embedded_probe:
        description: Only test frozen embedded source and the 4 GiB cap with the installed Linux companion
        type: boolean
        required: false
        default: false
      xtensa_companion_routing_probe:
        description: Only build with stock parent LLVM and test installed Xtensa routing on all three hosts
        type: boolean
        required: false
        default: false
      xtensa_companion_unpublished_fixture:
        description: Installer probe ONLY using hash-pinned UNPUBLISHED dry-run artifacts
        type: boolean
        required: false
        default: false
      xtensa_companion_install_probe:
        description: Only test optional published Xtensa installation on Linux and both Macs
        type: boolean
        required: false
        default: false
      android_pointer_tags_control:
        description: Also prove the tagged-pointer regression fails with the v0.2.47 stdlib
        type: boolean
        required: false
        default: false
      macos_runtime_bench:
        description: Only measure native Mac benchmark runtimes of two releases (default v0.2.45 versus v0.2.47)
        type: boolean
        required: false
        default: false
      macos_runtime_old:
        description: macos_runtime_bench - older release tag (its commit and compiler hash are pinned in tools/bench-macos-runtime.sh)
        type: string
        required: false
        default: v0.2.45
      macos_runtime_new:
        description: macos_runtime_bench - newer release tag
        type: string
        required: false
        default: v0.2.47
      macos_published_rebuild:
        description: Only compare native v0.2.47 rebuilds with both published Mac binaries
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Test the latest state of each PR/master branch without queuing old builds.
# This group is separate from Release and never cancels its gates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    if: ${{ !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control }}
    name: Linux suite (8 jobs)
    runs-on: ubuntu-24.04
    # About 29 minutes on a typical runner (2026-11-13); a slow runner is ~1.5x on every test.
    timeout-minutes: 60
    env:
      JOBS: '8'
      ABLA_TEST_JOBS: '1'
      ABLA_NATIVE_JOBS: '1'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # nix-shell finds its interactive bash through <nixpkgs>: the pinned one.
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Record the kernel and its file timestamp tick
        run: |
          uname -r
          # Distinct modification times among 200 back-to-back writes: 1 means a coarse clock.
          d=$(mktemp -d); for i in $(seq 200); do echo $i > "$d/f"; stat -c %y "$d/f"; done | sort -u | wc -l
      - name: Build the current compiler from the checksum-pinned bootstrap
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        env:
          ABLA_NATIVE_JOBS: '4'
          ABLA_CODEGEN_JOBS: '4'
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'make ablac' 2>&1 | tee build/ci-logs/linux-build.log
      # The compiler `make ablac` leaves was generated by the pinned bootstrap's
      # backend. The suite judges what the current backend generates (the libc
      # import guard lists the compiler's own imports), so it runs on the
      # compiler built by itself.
      - name: Rebuild the compiler with itself
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        env:
          ABLA_NATIVE_JOBS: '4'
          ABLA_CODEGEN_JOBS: '4'
        run: |
          nix-shell shell.nix --run 'tools/build-self-hosted-release.sh build/ablac.bin build/ci-ablac-stage2 src/orc_main.ab && mv -f build/ci-ablac-stage2 build/ablac.bin' 2>&1 | tee build/ci-logs/linux-stage2.log
      - name: Verify optional Xtensa catalog against published checksums
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        run: nix-shell shell.nix --run 'tools/test-xtensa-catalog.sh build/ablac --published'
      - name: Diagnose frozen compiler emit memory in alternating pairs
        if: inputs.xtensa_compiler_memory_probe
        run: |
          ulimit -S -s 8192
          nix-shell shell.nix --run 'node tools/probe-xtensa-emit-memory.mjs' 2>&1 | tee build-memory-probe.log
      - name: Retain paired memory samples and raw phase traces
        if: always() && inputs.xtensa_compiler_memory_probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xtensa-emit-memory
          path: |
            build-memory-probe.log
            build/xtensa-emit-memory/*.json
            build/xtensa-emit-memory/*.err
            build/xtensa-emit-memory/*.time
          retention-days: 7
      - name: Run the Linux suite
        if: ${{ !inputs.xtensa_compiler_memory_probe }}
        run: |
          # Keep the suite parent at its ordinary stack size; compiler launchers
          # raise their own stack. Large inherited stacks break capped threads.
          ulimit -S -s 8192
          nix-shell shell.nix --run 'make test' 2>&1 | tee build/ci-logs/linux-tests.log
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ci-logs
          path: |
            build/ci-logs/
            build/test-results/
          retention-days: 3
          if-no-files-found: ignore

  macos:
    if: ${{ !inputs.xtensa_compiler_memory_probe && !inputs.xtensa_companion_routing_probe && !inputs.xtensa_companion_embedded_probe && !inputs.xtensa_companion_install_probe && !inputs.macos_published_rebuild && !inputs.macos_runtime_bench && !inputs.android_pointer_tags_control }}
    name: macOS host and compiler fixed point
    # One standard arm64 runner; Intel remains part of the release matrix.
    runs-on: macos-15
    timeout-minutes: 35
    env:
      JOBS: '2'
      ABLA_NATIVE_JOBS: '2'
      ABLA_CODEGEN_JOBS: '2'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1200'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the bottled native toolchain
        run: |
          brew update
          # Fail rather than compile LLVM from source if a bottle is missing.
          brew install --force-bottle llvm@23 lld@23 openssl@3 binaryen
          {
            echo "$(brew --prefix llvm@23)/bin"
            echo "$(brew --prefix lld@23)/bin"
            echo "$(brew --prefix openssl@3)/bin"
          } >> "$GITHUB_PATH"
      - name: Fetch the checksum-pinned bootstrap
        run: tools/bootstrap-compiler.sh build/ci/bootstrap-ablac
      - name: Build stage 1 from current sources
        run: |
          mkdir -p build/ci-logs
          tools/build-self-hosted-current.sh \
            build/ci/bootstrap-ablac build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-stage1.log
      - name: Exercise the calls made by BSD system call, one by one (stage 1)
        run: |
          mkdir -p build/ci-logs
          tools/test-darwin-syscalls.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-darwin-syscalls.log
          tools/test-darwin-routines.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-darwin-routines.log
          tools/test-macho-section.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-macho-section.log
          tools/test-heap-allocator.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-heap-allocator.log
          tools/test-secure-fs.sh build/ci/ablac-stage1 \
            2>&1 | tee build/ci-logs/macos-secure-fs.log
      - name: Build stage 2 with stage 1
        run: |
          set +e
          tools/build-self-hosted-current.sh \
            build/ci/ablac-stage1 build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-stage2.log
          status=${PIPESTATUS[0]}
          echo "stage 2 build exit status: $status"
          exit $status
      - name: Exercise the native macOS host paths
        run: |
          tools/test-macos-host.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-host.log
      - name: Check the libSystem import guard
        run: |
          tools/test-libsystem-imports.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-libsystem-imports.log
      - name: Trace the compiler's remaining malloc and mutex imports (diagnostic)
        continue-on-error: true
        run: |
          binary=build/ci/ablac-stage2
          [[ -f $binary.bin ]] && binary=$binary.bin
          tools/macos-import-origin.sh "$binary" _malloc _free _realloc _pthread_mutex_lock _pthread_mutex_unlock \
            2>&1 | tee build/ci-logs/macos-import-origin.log
      - name: Link iOS slices and exercise an exported C call on Simulator
        run: |
          tools/test-ios-simulator.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/ios-simulator.log
      - name: Check the compiler fixed point and native child
        run: |
          # Builds stage 3, compares both generations' IR, checks the Darwin
          # adapter/object and executes a child built by the rebuilt compiler.
          tools/test-pure-self-rebuild.sh build/ci/ablac-stage2 \
            2>&1 | tee build/ci-logs/macos-self-rebuild.log
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-ci-logs
          path: build/ci-logs/
          retention-days: 3
          if-no-files-found: ignore

  macos-published-rebuild:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_published_rebuild }}
    name: v0.2.47 exact rebuild (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1200'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: driver
          persist-credentials: false
      - name: Check out the exact released source in a different directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.2.47
          path: source/independent/location/v0.2.47
          persist-credentials: false
      - name: Install the release's native toolchain
        run: driver/tools/install-macos-repro-toolchain.sh
      - name: Rebuild from the tag's seed and require exact published bytes
        run: >-
          driver/tools/test-macos-published-rebuild.sh
          source/independent/location/v0.2.47
          driver/build/macos-repro/${{ matrix.architecture }}
      - name: Retain raw binaries, objects, provenance and comparison diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-published-rebuild-${{ matrix.architecture }}
          path: |
            driver/build/macos-repro/${{ matrix.architecture }}/
            !driver/build/macos-repro/${{ matrix.architecture }}/cache/
          retention-days: 7
          if-no-files-found: error

  macos-runtime-bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_runtime_bench }}
    name: Native Mac runtime (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: driver
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.macos_runtime_old || 'v0.2.45' }}
          path: source-old
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.macos_runtime_new || 'v0.2.47' }}
          path: source-new
          persist-credentials: false
      - name: Install the native LLVM toolchain
        run: driver/tools/install-macos-repro-toolchain.sh
      - name: Build both releases' programs and measure five alternating runs
        env:
          OLD_TAG: ${{ inputs.macos_runtime_old || 'v0.2.45' }}
          NEW_TAG: ${{ inputs.macos_runtime_new || 'v0.2.47' }}
        run: >-
          driver/tools/bench-macos-runtime.sh source-old source-new
          driver/build/macos-runtime/${{ matrix.architecture }}
          "$OLD_TAG" "$NEW_TAG"
      - name: Retain every sample, binary, output and toolchain version
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-runtime-${{ matrix.architecture }}
          path: |
            driver/build/macos-runtime/${{ matrix.architecture }}/
            !driver/build/macos-runtime/${{ matrix.architecture }}/results/cache/
          retention-days: 14
          if-no-files-found: error

  android-pointer-tags-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_pointer_tags_control }}
    name: AArch64 tagged-pointer positive and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JOBS: '4'
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Fetch the pinned compiler (runtime-only source change)
        run: |
          mkdir -p build/ci-logs
          nix-shell shell.nix --run 'tools/bootstrap-compiler.sh build/pointer-bootstrap.bin'
      - name: Fetch the tagged-pointer negative-control stdlib
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.2.47
          path: build/tagged-pointer-baseline
          persist-credentials: false
      - name: Prove tagged-pointer positive and released-stdlib negative controls
        run: |
          ABLA_SYSROOT="$PWD" nix-shell shell.nix --run 'tools/test-android-pointer-tags.sh build/pointer-bootstrap.bin' \
            > build/ci-logs/pointer-tags-positive.log 2>&1
          if ABLA_SYSROOT="$PWD/build/tagged-pointer-baseline" \
            ABLA_TAGGED_POINTERS_OUT="$PWD/build/tagged-pointer-negative" \
            nix-shell shell.nix --run 'tools/test-android-pointer-tags.sh build/pointer-bootstrap.bin' \
            > build/ci-logs/pointer-tags-negative.log 2>&1; then
            echo 'released stdlib unexpectedly passed tagged-pointer regression' >&2
            exit 1
          fi
          # Require the specific old refusals, not an arbitrary build/emulator failure.
          grep -q 'FAIL tls-release: exit 11' build/ci-logs/pointer-tags-negative.log
          grep -q 'FAIL pages-release: exit 24' build/ci-logs/pointer-tags-negative.log
          grep -q 'FAIL rsa-release: exit 41' build/ci-logs/pointer-tags-negative.log
          grep -q 'FAIL descriptor-release: exit 133' build/ci-logs/pointer-tags-negative.log
          cat build/ci-logs/pointer-tags-positive.log
          cat build/ci-logs/pointer-tags-negative.log
      - name: Keep probe logs and generated objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-pointer-tags-control
          path: |
            build/ci-logs/
            build/android-pointer-tags/
            build/tagged-pointer-negative/
          retention-days: 7
          if-no-files-found: ignore

  xtensa-companion-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.xtensa_companion_install_probe }}
    name: Optional Xtensa installer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: x86_64-linux}
          - {runner: macos-15, platform: arm64-macos}
          - {runner: macos-15-intel, platform: x86_64-macos}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch explicitly UNPUBLISHED dry-run test input
        if: inputs.xtensa_companion_unpublished_fixture
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          repository: AndreBaltazar8/llvm-project
          run-id: '42214578962'
          name: companion-${{ matrix.platform }}
          github-token: ${{ github.token }}
          path: build/UNPUBLISHED-cohort
      - name: Install native build dependencies on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [[ '${{ matrix.platform }}' == x86_64-macos ]]; then
            # Homebrew no longer bottles newer LLVM 23 patches for Intel Macs.
            # Install its checksum-pinned 23.1.0 Sonoma bottles instead of
            # compiling LLVM and its build dependencies from source.
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
            export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
            for formula in openssl@3 zstd z3 binaryen; do
              if ! brew list --versions "$formula" >/dev/null 2>&1; then
                brew install --force-bottle "$formula"
              fi
            done
            install_bottle() {
              local formula=$1 checksum=$2 token bottle
              bottle="$RUNNER_TEMP/$formula--23.1.0.sonoma.bottle.tar.gz"
              token=$(curl -fsSL --retry 3 \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:homebrew/core/$formula:pull" |
                sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
              curl -fL --retry 3 -H "Authorization: Bearer $token" \
                "https://ghcr.io/v2/homebrew/core/$formula/blobs/sha256:$checksum" -o "$bottle"
              printf '%s  %s\n' "$checksum" "$bottle" | shasum -a 256 --check
              # Runner images disable local package paths by default; this
              # official bottle has just passed its pinned checksum check.
              env -u HOMEBREW_FORBID_PACKAGES_FROM_PATHS HOMEBREW_DEVELOPER=1 \
                brew install --ignore-dependencies "$bottle"
            }
            # homebrew-core: llvm 451e4146974a; lld 4c53d1f9e8fe.
            install_bottle llvm 0b0168dc611a9d77aaa62d094178297f8a861d647cc59c43a5dc3f76bd6eb7b2
            install_bottle lld c8affeb82959e53875d13cd58bc459f75863f17e3d4ad68d4ca939a104fd18d5
            prefix=$(brew --prefix)
            ln -sfn "$prefix/opt/llvm" "$prefix/opt/llvm@23"
            ln -sfn "$prefix/opt/lld" "$prefix/opt/lld@23"
            test "$("$prefix/opt/llvm@23/bin/llvm-config" --version)" = 23.1.0
            "$prefix/opt/lld@23/bin/wasm-ld" --version
          else
            # Runner images can carry formula metadata from before LLVM 23.
            brew update
            brew install llvm@23 lld@23 openssl@3 binaryen
          fi
          echo "$(brew --prefix)/opt/llvm@23/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/lld@23/bin" >> "$GITHUB_PATH"
      - name: Install native build dependencies on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf libssl-dev gcc libc6-dev
      - name: Build the native candidate with the pinned published compiler
        run: tools/build-xtensa-native-probe-package.sh
      - name: Native catalog negatives and published checksum check
        run: |
          compiler="$(find build/native-probe-package/unpacked -path '*/libexec/ablac.bin' -type f | head -1)"
          tools/test-xtensa-catalog.sh "$compiler" ${{ inputs.xtensa_companion_unpublished_fixture && '' || '--published' }}
          tools/test-xtensa-native.sh "$compiler"
          tools/test-xtensa-companion-offline.sh "$compiler"
          node tests/cases/xtensa-install-probe/report-test.mjs
      - name: Install into the published parent without replacing its LLVM or Clang
        env:
          USE_UNPUBLISHED: ${{ inputs.xtensa_companion_unpublished_fixture }}
        run: |
          if [[ "$USE_UNPUBLISHED" == true ]]; then
            node tools/test-xtensa-installed.mjs build/xtensa-installed --native-package build/native-probe-package/candidate.tar.gz \
              --unpublished-fixture tools/fixtures/xtensa-companion-unpublished.json \
              --archive "$(find build/UNPUBLISHED-cohort -maxdepth 1 -name '*.tar.gz' -print)"
          else
            node tools/test-xtensa-installed.mjs build/xtensa-installed --native-package build/native-probe-package/candidate.tar.gz
          fi
      - name: Retain exact codegen and installation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xtensa-installed-${{ matrix.runner }}-native
          path: |
            build/xtensa-installed/result.json
            build/xtensa-installed/tamper-negative.txt
            build/xtensa-installed/*.s
            build/xtensa-installed/*.o
          retention-days: 7
          if-no-files-found: ignore

  xtensa-companion-install-report:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.xtensa_companion_install_probe }}
    needs: xtensa-companion-install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: xtensa-installed-*
          path: build/xtensa-install-results
      - name: Validate the native installer on all three hosts
        run: node tools/report-xtensa-install-probe.mjs build/xtensa-install-results build/xtensa-install-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: xtensa-installed-comparison
          path: build/xtensa-install-comparison.json
          retention-days: 7
          if-no-files-found: warn

  xtensa-companion-routing:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.xtensa_companion_routing_probe || inputs.xtensa_companion_embedded_probe) }}
    name: Stock parent Xtensa routing (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.xtensa_companion_embedded_probe && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the frozen public embedded gate
        if: inputs.xtensa_companion_embedded_probe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: AndreBaltazar8/abla-embedded
          ref: da5a939a4b0a20a7f97fb58494e3eac7ec4bc7ff
          path: build/xtensa-embedded-source
          persist-credentials: false
      - name: Install bottled stock Mac LLVM, never build LLVM from source
        if: runner.os == 'macOS'
        run: tools/install-macos-repro-toolchain.sh
      - name: Build and exercise the real installed Mac compiler
        if: runner.os == 'macOS'
        run: tools/test-xtensa-stock-toolchain.sh 2>&1 | tee build-routing.log
      - name: Build and exercise the real installed Linux compiler with its published bootstrap
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/abla" -w /abla -e GITHUB_ACTIONS=true \
            -e ABLA_XTENSA_EMBEDDED_GATE=${{ inputs.xtensa_companion_embedded_probe }} \
            ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 \
            bash -ceu '
              tools/install-xtensa-stock-test-deps.sh
              export PATH=/usr/lib/llvm-23/bin:$PATH
              tools/test-xtensa-stock-toolchain.sh
            ' 2>&1 | tee build-routing.log
      - name: Retain target objects, parent identity and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xtensa-routing-${{ matrix.runner }}
          path: |
            build-routing.log
            build/xtensa-stock/result.json
            build/xtensa-stock/parent-llc-version.txt
            build/xtensa-stock/parent-llc-options.txt
            build/xtensa-stock/embedded-check-source.log
            build/xtensa-stock/embedded-check-time.json
            build/xtensa-stock/*.o
            build/xtensa-stock/*.o.ll
          retention-days: 7
          if-no-files-found: ignore
