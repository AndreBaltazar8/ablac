name: AArch64 static deps

# #806 step C: the AArch64 LLVM archives, libstdc++.a, libz.a and libgcc.a the statically linked compiler for aarch64-linux links
# (nix/aarch64-static-deps.nix). The cross libllvm is in no binary cache and builds from source (about two hours), so this runs by hand, once per
# change of that file or of the nixpkgs pin, and keeps the files in the Actions cache; the CI job static-compiler-aarch64 restores them and skips,
# with a notice, while there is no cache. Nothing here is published as a release asset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    name: Build the AArch64 static dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Already cached?
        id: cached
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/aarch64-static-deps
          key: aarch64-static-deps-v1-${{ hashFiles('nix/aarch64-static-deps.nix', 'nix/nixpkgs.nix') }}
          lookup-only: true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the cross LLVM archives, zlib and the C++ runtime for AArch64
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          nix-build nix/aarch64-static-deps.nix --cores 0 --out-link build/aarch64-static-deps-result
          mkdir -p build/aarch64-static-deps
          cp -rL build/aarch64-static-deps-result/. build/aarch64-static-deps/
          ls -l build/aarch64-static-deps/llvm | head -5
          ls -l build/aarch64-static-deps/libs
          du -sh build/aarch64-static-deps
      - name: Keep them in the Actions cache
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/aarch64-static-deps
          key: aarch64-static-deps-v1-${{ hashFiles('nix/aarch64-static-deps.nix', 'nix/nixpkgs.nix') }}
