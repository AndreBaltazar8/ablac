name: Nightly static compiler

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-static
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '4'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/master
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the static compiler once
        run: |
          mkdir -p build/nightly-static
          ulimit -S -s 8192
          nix-shell shell.nix --run '
            set -euo pipefail
            make ablac
            tools/build-self-hosted-release.sh build/ablac.bin build/nightly-static/stage2 src/orc_main.ab
            tools/static-llvm-env.sh > build/nightly-static/llvm-env.sh
            source build/nightly-static/llvm-env.sh
            tools/build-static-compiler.sh build/nightly-static/stage2 build/nightly-static/ablac-x86_64-linux
            tools/test-static-artifact.sh build/nightly-static/ablac-x86_64-linux --no-fixpoint
          ' 2>&1 | tee build/nightly-static/build.log
          git rev-parse HEAD > build/nightly-static/static-suite-source.sha
          (cd build/nightly-static && sha256sum ablac-x86_64-linux > ablac-x86_64-linux.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-static-compiler
          path: |
            build/nightly-static/ablac-x86_64-linux
            build/nightly-static/ablac-x86_64-linux.sha256
            build/nightly-static/static-suite-source.sha
          if-no-files-found: error
          retention-days: 7
      - name: Keep the static build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-static-build-log
          path: build/nightly-static/build.log
          if-no-files-found: ignore
          retention-days: 7

  suite:
    needs: compiler
    uses: ./.github/workflows/static-suite.yml
    with:
      artifact: nightly-static-compiler
