# Manual producer. The maintainer verifies and publishes the artifact to the LLVM fork.
name: LLVM RISC-V 64 static archives

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Asset revision for llvm-23.1.3-fdiv-<revision>-riscv64-linux.tar.xz'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Cross-build patched LLVM and lld for riscv64-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the RV64 SDK inputs
        run: |
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]] || { echo 'use a positive asset revision' >&2; exit 2; }
          nix-build nix/llvm-riscv64-static.nix -A inputs -o rv64-sdk-inputs --max-jobs 1 --cores 4
      - name: Verify under QEMU and pack the RV64 archives
        run: |
          nix-shell -p binutils nodejs qemu-user xz --run 'tools/package-llvm-riscv64-static.sh rv64-sdk-inputs'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-riscv64-static
          path: |
            llvm-23.1.3-fdiv-*-riscv64-linux.tar.xz
            llvm-23.1.3-fdiv-*-riscv64-linux.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
