# The maintainer verifies and publishes the checked artifact to the LLVM fork.
name: LLVM Windows x64 static archives

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Asset revision for llvm-23.1.3-fdiv-<revision>-x86_64-windows-msvc.tar.xz'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Patched LLVM and lld static archives for x86_64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 350
    env:
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and verify the native /MT archives
        shell: pwsh
        run: ./tools/package-llvm-windows-static.ps1
      - name: Pack the verified archives
        shell: bash
        run: |
          asset="llvm-23.1.3-fdiv-${REVISION}-x86_64-windows-msvc"
          /usr/bin/tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "$asset" |
            'C:/Program Files/7-Zip/7z.exe' a -txz -mmt=2 -si "$asset.tar.xz"
          sha256sum "$asset.tar.xz" > "$asset.tar.xz.sha256"
          sha256sum -c "$asset.tar.xz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-windows-static
          path: |
            llvm-23.1.3-fdiv-*-x86_64-windows-msvc.tar.xz
            llvm-23.1.3-fdiv-*-x86_64-windows-msvc.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
