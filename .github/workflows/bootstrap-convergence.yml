name: Historical bootstrap convergence

on:
  workflow_dispatch:
    inputs:
      lineage:
        description: The pair of routes (see LINEAGES in tools/test-bootstrap-convergence.py)
        type: choice
        options: ["v0.2.45", "v0.2.51"]
        default: "v0.2.45"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  route:
    name: Fresh Linux route ${{ matrix.route }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        route: [a, b]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Check comparison failures are not accepted
        run: python3 tools/test-bootstrap-convergence-unit.py
      - name: Reserve the same logical source path on this fresh builder
        run: sudo install -d -o "$USER" -g "$(id -gn)" /build
      - name: Bootstrap this route without compiler or object caches
        run: >-
          python3 tools/test-bootstrap-convergence.py route
          --lineage "${{ inputs.lineage }}" ${{ matrix.route }}
          build/convergence-${{ matrix.route }}
      - name: Retain raw IR, binaries, provenance and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: convergence-${{ matrix.route }}
          path: build/convergence-${{ matrix.route }}/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare raw IR and bootstrap provenance
    needs: route
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: convergence-*
          path: build/routes
      - name: Require both complete routes, identical provenance and exact IR
        run: >-
          python3 tools/test-bootstrap-convergence.py compare
          --lineage "${{ inputs.lineage }}"
          build/routes/convergence-a build/routes/convergence-b build/comparison
      - name: Retain comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: convergence-comparison
          path: build/comparison/
          if-no-files-found: error
          retention-days: 14
