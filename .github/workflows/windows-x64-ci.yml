name: Windows x64 toolchain smoke

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-toolchain-smoke
  cancel-in-progress: false

jobs:
  windows-toolchain:
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/windows-x64-toolchain.yml
    with:
      source_ref: ${{ github.sha }}
      ci: true
