name: Static compiler suite

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact containing the Linux static compiler, checksum and source revision
        required: true
        type: string
      release_mode:
        description: Enable release-mode tests
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shard:
    name: Static suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Four shards: in v0.2.78's release run (45898824396) each of two took 36 minutes on an ordinary runner (8,048 CPU seconds
    # of the release-mode suite on four CPUs), the critical path of the release. The split is tools/test-times.tsv's, which
    # tools/test-shards.sh checks for 2, 3 and 4 shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # No ABLA_TEST_JOBS: under the suite the tests that run builds of their own at once (test-self-hosted.sh,
    # test-aarch64-linux.sh, test-libc-free-programs.sh) take their suite default of 2 workers. At 1, test-self-hosted.sh
    # alone took 1,974 s of shard 2's 3,327 in that run, and the seven commands that wait for it started after it.
    env:
      JOBS: '8'
      ABLA_NATIVE_JOBS: '1'
      ABLA_CODEGEN_JOBS: '1'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1800'
      RUN_TESTS_FULL: ${{ inputs.release_mode && '1' || '' }}
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/static-suite-compiler
      - name: Verify the static artifact and read its source revision
        id: identity
        working-directory: ${{ runner.temp }}/static-suite-compiler
        run: |
          sha256sum -c ablac-x86_64-linux.sha256
          sha256sum ablac-x86_64-linux > tested-compiler.sha256
          cmp ablac-x86_64-linux.sha256 tested-compiler.sha256
          source=$(cat static-suite-source.sha)
          [[ $source =~ ^[0-9a-f]{40}$ ]]
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.identity.outputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/install-nix
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Install the verified compiler and prepare the test inputs
        run: |
          mkdir -p build/ci-static-suite
          artifact="$RUNNER_TEMP/static-suite-compiler"
          test "$(git rev-parse HEAD)" = "$(cat "$artifact/static-suite-source.sha")"
          cp "$artifact/"{tested-compiler.sha256,static-suite-source.sha} build/ci-static-suite/
          install -m 0755 "$artifact/ablac-x86_64-linux" build/ablac.bin
          ln -s ../tools/run-limited-compiler.sh build/ablac
          tools/prepare-abla-test-driver.sh
          export PATH="$PATH:/usr/sbin:/sbin"
          command -v debugfs >/dev/null || sudo apt-get install -y --no-install-recommends e2fsprogs
          command -v unzip >/dev/null || sudo apt-get install -y --no-install-recommends unzip
          tools/prepare-android-ndk.sh "$RUNNER_TEMP/android"
          tools/prepare-bionic-sysroot.sh "$RUNNER_TEMP/bionic"
          {
            echo "ABLA_ANDROID_NDK=$RUNNER_TEMP/android/android-ndk-r27c"
            echo "ABLA_BIONIC_ROOT=$RUNNER_TEMP/bionic"
            echo "ABLA_REQUIRE_ANDROID_TESTS=1"
          } >> "$GITHUB_ENV"
      - name: Run the shard with the published layout
        env:
          ABLA_DOC_COVERAGE_BASE: ${{ steps.identity.outputs.source }}
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit -S -s 8192
          # The inner shell expands the suite variables.
          # shellcheck disable=SC2016
          nix-shell shell.nix --run '
            set -euo pipefail
            out=build/ci-static-suite
            RUN_TESTS_LIST=1 RUN_TESTS_OUTPUT="$out/selection" tools/run-tests.sh build/ablac | sort -n > "$out/expected.ids"
            test -s "$out/expected.ids"
            RUN_TESTS_SHARD="$SHARD/4" RUN_TESTS_OUTPUT="$out/suite" tools/run-tests.sh build/ablac
            sha256sum < build/ablac.bin | cut -d " " -f1 > "$out/payload.hash"
            cut -d " " -f1 "$out/tested-compiler.sha256" > "$out/expected.hash"
            cmp "$out/payload.hash" "$out/expected.hash"
          ' 2>&1 | tee build/ci-static-suite/shard.log
      - name: Keep command results, logs and compiler identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-suite-logs-${{ matrix.shard }}
          path: build/ci-static-suite/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Verify the full static recipe passed
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: static-suite-logs-*
          path: shards
      - name: Check that every shard covered the same artifact and together the full recipe
        run: |
          shards=4
          first=shards/static-suite-logs-1
          results=()
          for ((index = 1; index <= shards; index++)); do
            shard=shards/static-suite-logs-$index
            cmp "$first/static-suite-source.sha" "$shard/static-suite-source.sha"
            cmp "$first/tested-compiler.sha256" "$shard/tested-compiler.sha256"
            cmp "$first/expected.ids" "$shard/expected.ids"
            cmp "$first/suite/commands.txt" "$shard/suite/commands.txt"
            test -s "$shard/suite/results.tsv"
            awk -F '\t' 'NF < 4 || $2 != "0" { bad=1 } END { exit bad }' "$shard/suite/results.tsv"
            results+=("$shard/suite/results.tsv")
          done
          # No artifact beyond the shards the matrix ran (a stale count would leave a shard unchecked).
          test "$(find shards -mindepth 1 -maxdepth 1 -name 'static-suite-logs-*' | wc -l)" -eq "$shards"
          cut -f1 "${results[@]}" | sort -n > actual.ids
          cmp "$first/expected.ids" actual.ids
          printf '%s commands passed with compiler %s\n' "$(wc -l < actual.ids)" "$(cat "$first/tested-compiler.sha256")" >> "$GITHUB_STEP_SUMMARY"
