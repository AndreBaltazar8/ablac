name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      bridge_release:
        description: Optional draft release containing checksum-pinned bridge artifacts
        required: false
        type: string
      publish_release:
        description: Publish after building and validating artifacts
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: ablac-x86_64-linux
            architecture: x86_64
            platform: linux
          - runner: macos-15
            asset: ablac-arm64-macos
            architecture: arm64
            platform: macos
          - runner: macos-15-intel
            asset: ablac-x86_64-macos
            architecture: x86_64
            platform: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - if: matrix.platform == 'linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - if: matrix.platform == 'macos'
        name: Install the native toolchain
        run: |
          brew install llvm@21 lld@21 openssl@3
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@21)/bin" >> "$GITHUB_PATH"
      - name: Prepare the bootstrap compiler
        env:
          BRIDGE_RELEASE: ${{ inputs.bridge_release }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$BRIDGE_RELEASE" ]]; then
            tools/bootstrap-compiler.sh build/bootstrap-ablac
          else
            mkdir -p build/bridge
            if [[ "${{ matrix.platform }}" == linux ]]; then
              bridge=ablac-x86_64-linux.bridge
              gh release download "$BRIDGE_RELEASE" \
                --pattern "$bridge" --pattern "$bridge.sha256" \
                --dir build/bridge
              (cd build/bridge && sha256sum --check "$bridge.sha256")
              cp "build/bridge/$bridge" build/bootstrap-ablac
            else
              bridge=${{ matrix.asset }}.o
              gh release download "$BRIDGE_RELEASE" \
                --pattern "$bridge" --pattern "$bridge.sha256" \
                --dir build/bridge
              (cd build/bridge && shasum -a 256 --check "$bridge.sha256")
              llvm_prefix=$(brew --prefix llvm@21)
              openssl_prefix=$(brew --prefix openssl@3)
              tools/macos-clang.sh -O2 -c runtime/abla_darwin_compat.c \
                -o build/bridge/abla-darwin-compat.o
              tools/macos-clang.sh -pthread -Wl,-dead_strip \
                "build/bridge/$bridge" build/bridge/abla-darwin-compat.o \
                -L"$llvm_prefix/lib" -Wl,-rpath,"$llvm_prefix/lib" -lLLVM \
                -L"$openssl_prefix/lib" -Wl,-rpath,"$openssl_prefix/lib" \
                -lssl -lcrypto -o build/bootstrap-ablac
            fi
            chmod +x build/bootstrap-ablac
            if [[ "${{ matrix.platform }}" == linux ]]; then
              bridge_version=$(nix-shell shell.nix --run \
                'build/bootstrap-ablac --version')
            else
              bridge_version=$(build/bootstrap-ablac --version)
            fi
            test "$bridge_version" = "ablac ${RELEASE_TAG#v}"
          fi
      - name: Build the tagged compiler from the prepared bootstrap
        run: |
          tools/build-self-hosted-current.sh \
            build/bootstrap-ablac build/release/${{ matrix.asset }}
      - name: Verify and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ matrix.platform }}" == linux ]]; then
            version=$(nix-shell shell.nix --run \
              "build/release/${{ matrix.asset }} --version")
          else
            version=$(build/release/${{ matrix.asset }} --version)
          fi
          test "$version" = "ablac ${RELEASE_TAG#v}"
          printf '%s\n' "$version"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd build/release && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          else
            (cd build/release && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi
      - if: matrix.platform == 'linux'
        name: Package the portable Linux toolchain
        run: |
          docker run --rm \
            -v "$PWD:/abla" \
            ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f \
            bash -ceu '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                binaryen ca-certificates curl gnupg patchelf
              curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm.asc
              fingerprint=$(gpg --show-keys --with-colons /tmp/llvm.asc |
                awk -F: '\''$1 == "fpr" { print $10; exit }'\'')
              test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
              gpg --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg /tmp/llvm.asc
              echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
                > /etc/apt/sources.list.d/llvm.list
              apt-get update
              apt-get install -y --no-install-recommends clang-21 llvm-21 lld-21 libssl3
              export PATH=/usr/lib/llvm-21/bin:$PATH
              /abla/tools/package-linux-toolchain.sh \
                /abla/build/release/ablac-x86_64-linux \
                /abla \
                /abla/build/release/abla-toolchain-x86_64-linux.tar.gz
            '
      - if: matrix.platform == 'macos'
        name: Package the macOS toolchain
        run: |
          tools/package-macos-toolchain.sh \
            '${{ matrix.architecture }}' \
            'build/release/${{ matrix.asset }}' \
            . \
            'build/release/abla-toolchain-${{ matrix.architecture }}-macos.tar.gz'
      - name: Exercise the packaged toolchain
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          archive="build/release/abla-toolchain-${{ matrix.architecture }}-${{ matrix.platform }}.tar.gz"
          install_root="$RUNNER_TEMP/abla-toolchain"
          mkdir -p "$install_root" "$RUNNER_TEMP/abla-smoke"
          tar -xzf "$archive" -C "$install_root" --strip-components=1
          export PATH="$install_root/bin:$PATH"
          if [[ '${{ matrix.platform }}' == macos ]]; then
            llvm_bin=$(brew --prefix llvm@21)/bin
            lld_bin=$(brew --prefix lld@21)/bin
            export PATH="$llvm_bin:$lld_bin:$PATH"
          fi
          test "$(ablac --version)" = "ablac ${RELEASE_TAG#v}"
          printf 'fun main: int = 0\n' > "$RUNNER_TEMP/abla-smoke/main.ab"
          (cd "$RUNNER_TEMP/abla-smoke" && ablac build main.ab -o hello)
          "$RUNNER_TEMP/abla-smoke/hello"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            build/release/${{ matrix.asset }}
            build/release/${{ matrix.asset }}.sha256
            build/release/abla-toolchain-${{ matrix.architecture }}-${{ matrix.platform }}.tar.gz
            build/release/abla-toolchain-${{ matrix.architecture }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_release }}
    needs: compiler
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            for bridge in \
              ablac-x86_64-linux.bridge \
              ablac-x86_64-linux.bridge.sha256 \
              ablac-x86_64-macos.o \
              ablac-x86_64-macos.o.sha256 \
              ablac-arm64-macos.o \
              ablac-arm64-macos.o.sha256
            do
              gh release delete-asset "$RELEASE_TAG" "$bridge" --yes \
                >/dev/null 2>&1 || true
            done
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --verify-tag --title "Abla ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "Abla ${RELEASE_TAG#v}"
          fi
