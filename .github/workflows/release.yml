name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      bridge_release:
        description: Optional draft release containing checksum-pinned bridge artifacts
        required: false
        type: string
      source_ref:
        description: Build this branch or commit instead of the tag, to test the workflow (with publish_release off)
        required: false
        type: string
      publish_release:
        description: Publish after building and validating artifacts
        required: true
        default: true
        type: boolean
      windows:
        description: "Windows toolchain: off, with (add to release), only (test the zip), or fixpoint (test the zip and self-build)"
        required: true
        default: with
        type: choice
        options:
          - 'off'
          - with
          - only
          - fixpoint
      windows_fixpoint_tier:
        description: Compile-time evaluation tier for the Windows fixed-point test
        default: interp
        type: choice
        options:
          - interp
          - native
      windows_arm64:
        description: 'ARM64 Windows toolchain: off, with (add to release), only (test the zip), or fixpoint (test the zip and self-build).'
        required: true
        default: with
        type: choice
        options: ['off', with, only, fixpoint]

permissions:
  contents: read

jobs:
  # A draft bridge release is visible only to a token with push access. This job alone holds it: it copies the bridge assets into one
  # artifact (it checks nothing out, so no script of any tree runs with the token), and the compiler jobs, which run the scripts of
  # the tree they check out (the tag, or source_ref when testing), hold only contents: read and take the assets from the artifact.
  bridge:
    if: ${{ inputs.bridge_release != '' && inputs.windows != 'only' && inputs.windows != 'fixpoint' && inputs.windows_arm64 != 'only' && inputs.windows_arm64 != 'fixpoint' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the bridge assets
        env:
          BRIDGE_RELEASE: ${{ inputs.bridge_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir bridge
          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$BRIDGE_RELEASE\") | .id" \
            | sed -n '1p')
          test -n "$release_id"
          for asset_name in \
            ablac-x86_64-linux.bridge ablac-x86_64-linux.bridge.sha256 \
            ablac-x86_64-macos.o ablac-x86_64-macos.o.sha256 \
            ablac-arm64-macos.o ablac-arm64-macos.o.sha256
          do
            asset_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$asset_name\") | .id")
            test -n "$asset_id"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "bridge/$asset_name"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-assets
          path: bridge/*
          if-no-files-found: error
          retention-days: 1

  # The compiler builds (.github/workflows/release-compiler.yml). Linux is a job of its own because the static suite needs only its
  # artifact: in v0.2.78's run 45898824396 Linux was done at 23 minutes and the suite waited until the Intel Mac (its runner 7 minutes
  # late) finished at 32. Publishing still needs all three.
  compiler-linux:
    needs: bridge
    if: ${{ !cancelled() && !failure() && inputs.windows != 'only' && inputs.windows != 'fixpoint' && inputs.windows_arm64 != 'only' && inputs.windows_arm64 != 'fixpoint' }}
    uses: ./.github/workflows/release-compiler.yml
    with:
      runner: ubuntu-24.04
      asset: ablac-x86_64-linux
      architecture: x86_64
      platform: linux
      tag: ${{ inputs.tag }}
      bridge_release: ${{ inputs.bridge_release }}
      source_ref: ${{ inputs.source_ref }}
      publish_release: ${{ inputs.publish_release }}

  compiler-macos:
    needs: bridge
    if: ${{ !cancelled() && !failure() && inputs.windows != 'only' && inputs.windows != 'fixpoint' && inputs.windows_arm64 != 'only' && inputs.windows_arm64 != 'fixpoint' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: ablac-arm64-macos
            architecture: arm64
          - runner: macos-15-intel
            asset: ablac-x86_64-macos
            architecture: x86_64
    uses: ./.github/workflows/release-compiler.yml
    with:
      runner: ${{ matrix.runner }}
      asset: ${{ matrix.asset }}
      architecture: ${{ matrix.architecture }}
      platform: macos
      tag: ${{ inputs.tag }}
      bridge_release: ${{ inputs.bridge_release }}
      source_ref: ${{ inputs.source_ref }}
      publish_release: ${{ inputs.publish_release }}

  static-suite:
    if: ${{ !cancelled() && !failure() && inputs.windows != 'only' && inputs.windows != 'fixpoint' && inputs.windows_arm64 != 'only' && inputs.windows_arm64 != 'fixpoint' }}
    needs: compiler-linux
    uses: ./.github/workflows/static-suite.yml
    with:
      artifact: ablac-x86_64-linux
      release_mode: true

  # The smoke test and Release build and exercise the same Windows toolchain zip.
  windows-toolchain:
    if: ${{ inputs.windows != 'off' && inputs.windows_arm64 != 'only' && inputs.windows_arm64 != 'fixpoint' }}
    uses: ./.github/workflows/windows-x64-toolchain.yml
    with:
      source_ref: ${{ inputs.source_ref || inputs.tag }}

  windows-fixpoint:
    if: ${{ inputs.windows == 'with' || inputs.windows == 'fixpoint' }}
    needs: windows-toolchain
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: ablac-windows-toolchain
          path: build/windows-release
      - name: Install the verified Windows LLVM SDK
        shell: pwsh
        run: ./tools/windows/install-static-llvm.ps1 -Destination build/llvm
      - name: Compare two native self-builds
        shell: pwsh
        env:
          FIXPOINT_TIER: ${{ inputs.windows == 'with' && 'native' || inputs.windows_fixpoint_tier }}
        run: |
          ./tools/windows/check-compiler-fixpoint.ps1 `
            -Archive build/windows-release/abla-toolchain-x86_64-windows.zip `
            -LlvmRoot build/llvm -BuildDirectory build/windows-fixpoint -Tier $env:FIXPOINT_TIER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: windows-fixpoint-logs
          path: |
            build/windows-fixpoint/stage*/compile.log
            build/windows-fixpoint/native-*/compile.log
          retention-days: 7

  windows-arm64:
    if: ${{ inputs.windows_arm64 == 'only' || inputs.windows_arm64 == 'fixpoint' || (inputs.windows_arm64 == 'with' && inputs.windows != 'only' && inputs.windows != 'fixpoint') }}
    uses: ./.github/workflows/windows-arm64-toolchain.yml
    with:
      source_ref: ${{ inputs.source_ref || inputs.tag }}
      fixpoint_tier: ${{ inputs.windows_arm64 == 'with' && 'native' || inputs.windows_arm64 == 'fixpoint' && inputs.windows_fixpoint_tier || '' }}

  publish:
    # A Windows-only mode or a failed or cancelled dependency blocks publication.
    if: ${{ !cancelled() && !failure() && inputs.publish_release && inputs.windows != 'only' && inputs.windows != 'fixpoint' && inputs.windows_arm64 != 'only' && inputs.windows_arm64 != 'fixpoint' && needs.compiler-linux.result == 'success' && needs.compiler-macos.result == 'success' && needs.static-suite.result == 'success' && (inputs.windows != 'with' || needs.windows-fixpoint.result == 'success') && (inputs.windows_arm64 != 'with' || needs.windows-arm64.result == 'success') }}
    needs: [compiler-linux, compiler-macos, static-suite, windows-toolchain, windows-fixpoint, windows-arm64]
    runs-on: ubuntu-24.04
    # The signing key lives in this environment (master-only, André as the required reviewer), not in a repository secret.
    environment: release
    permissions:
      contents: write
      # The build provenance attestation (SLSA): GitHub's OIDC token and the attestations API.
      id-token: write
      attestations: write
    steps:
      - name: Refuse source_ref
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test -z "$SOURCE_REF" || { echo "a published release is built from its tag, not from source_ref" >&2; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # One directory per artifact (no merge-multiple: a file name two artifacts share would let the later one overwrite the earlier
      # silently); tools/release-flatten-artifacts.sh (tested by test-release-scripts) refuses a shared name and flattens them into release/.
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: ablac-*
          path: release-parts
      - name: Check the build, make the bill of materials and sign the release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_WINDOWS: ${{ inputs.windows }}
          RELEASE_WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
          ABLA_RELEASE_SIGNING_KEY: ${{ secrets.ABLA_RELEASE_SIGNING_KEY }}
        run: |
          tools/release-flatten-artifacts.sh release-parts release
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          test "$(cat release/static-suite-source.sha)" = "$(git rev-parse HEAD)"
          (cd release && sha256sum -c ablac-x86_64-linux.sha256)
          if [[ "$RELEASE_WINDOWS" == with ]]; then
            test -s release/abla-toolchain-x86_64-windows.zip
            (cd release && sha256sum -c abla-toolchain-x86_64-windows.zip.sha256)
          fi
          if [[ "$RELEASE_WINDOWS_ARM64" == with ]]; then
            test -s release/ablac-windows-arm64.zip
            (cd release && sha256sum -c ablac-windows-arm64.zip.sha256)
          fi
          rm release/static-suite-source.sha
          # The bill of materials, then the signature (decision #110): SHA256SUMS lists every asset, the SBOM
          # included, and ssh-keygen -Y sign (namespace abla-release) signs it with the project key from the
          # Actions secret. sign-release.sh verifies the result against release-signing.pub, so a wrong secret
          # fails here and nothing is published. setup-abla, tools/bootstrap-compiler.sh and tools/release-pin.sh
          # verify the same way (tools/verify-release.sh). The key file is written 0600 and removed.
          # The key signs only a run dispatched from master (the tag it releases is checked out above): a workflow
          # dispatched on another branch cannot use it to sign (docs/ci-security.md also asks for a protected environment).
          test "$GITHUB_REF" = refs/heads/master
          test -n "$ABLA_RELEASE_SIGNING_KEY"
          tools/release-sbom.sh "$RELEASE_TAG" release "$RUNNER_TEMP/ablac-${RELEASE_TAG#v}.spdx.json"
          mv "$RUNNER_TEMP/ablac-${RELEASE_TAG#v}.spdx.json" release/
          signing_key=$(mktemp)
          trap 'rm -f "$signing_key"' EXIT
          (umask 077; printf '%s\n' "$ABLA_RELEASE_SIGNING_KEY" > "$signing_key")
          tools/sign-release.sh release "$signing_key"
      # Build provenance (SLSA) for every asset including SHA256SUMS and its signature, from this workflow run:
      # `gh attestation verify <asset> --repo AndreBaltazar8/ablac` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            for bridge in \
              ablac-x86_64-linux.bridge \
              ablac-x86_64-linux.bridge.sha256 \
              ablac-x86_64-macos.o \
              ablac-x86_64-macos.o.sha256 \
              ablac-arm64-macos.o \
              ablac-arm64-macos.o.sha256
            do
              gh release delete-asset "$RELEASE_TAG" "$bridge" --yes \
                >/dev/null 2>&1 || true
            done
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --verify-tag --title "Abla ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "Abla ${RELEASE_TAG#v}"
          fi
