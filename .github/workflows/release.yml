name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      bridge_release:
        description: Optional draft release containing checksum-pinned bridge artifacts
        required: false
        type: string
      source_ref:
        description: Build this branch or commit instead of the tag, to test the workflow (with publish_release off)
        required: false
        type: string
      publish_release:
        description: Publish after building and validating artifacts
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  compiler:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: ablac-x86_64-linux
            architecture: x86_64
            platform: linux
          - runner: macos-15
            asset: ablac-arm64-macos
            architecture: arm64
            platform: macos
          - runner: macos-15-intel
            asset: ablac-x86_64-macos
            architecture: x86_64
            platform: macos
    runs-on: ${{ matrix.runner }}
    env:
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: 1800
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
          persist-credentials: false
      - if: matrix.platform == 'linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - if: matrix.platform == 'macos'
        name: Install the pinned patched native LLVM toolchain
        run: tools/install-macos-llvm.sh
      - name: Prepare the bootstrap compiler
        env:
          BRIDGE_RELEASE: ${{ inputs.bridge_release }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$BRIDGE_RELEASE" ]]; then
            tools/bootstrap-compiler.sh build/bootstrap-ablac
          else
            mkdir -p build/bridge
            release_id=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$BRIDGE_RELEASE\") | .id" \
              | sed -n '1p')
            test -n "$release_id"
            download_bridge_asset() {
              local asset_name=$1
              local asset_id
              asset_id=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
                --jq ".[] | select(.name == \"$asset_name\") | .id")
              test -n "$asset_id"
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                > "build/bridge/$asset_name"
            }
            if [[ "${{ matrix.platform }}" == linux ]]; then
              bridge=ablac-x86_64-linux.bridge
              download_bridge_asset "$bridge"
              download_bridge_asset "$bridge.sha256"
              (cd build/bridge && sha256sum --check "$bridge.sha256")
              cp "build/bridge/$bridge" build/bootstrap-ablac
            else
              bridge=${{ matrix.asset }}.o
              download_bridge_asset "$bridge"
              download_bridge_asset "$bridge.sha256"
              (cd build/bridge && shasum -a 256 --check "$bridge.sha256")
              llvm_prefix=$ABLA_LLVM
              openssl_prefix=$(brew --prefix openssl@3)
              tools/macos-clang.sh -O2 -c runtime/abla_darwin_compat.c \
                -o build/bridge/abla-darwin-compat.o
              tools/macos-clang.sh -pthread -Wl,-dead_strip \
                "build/bridge/$bridge" build/bridge/abla-darwin-compat.o \
                -L"$llvm_prefix/lib" -Wl,-rpath,"$llvm_prefix/lib" -lLLVM \
                -L"$openssl_prefix/lib" -Wl,-rpath,"$openssl_prefix/lib" \
                -lssl -lcrypto -o build/bootstrap-ablac
            fi
            chmod +x build/bootstrap-ablac
            if [[ "${{ matrix.platform }}" == linux ]]; then
              bridge_version=$(nix-shell shell.nix --run \
                'build/bootstrap-ablac --version')
            else
              bridge_version=$(DYLD_LIBRARY_PATH="$ABLA_LLVM/lib" build/bootstrap-ablac --version)
            fi
            test "$bridge_version" = "ablac ${RELEASE_TAG#v}"
          fi
      - name: Build the tagged compiler from the prepared bootstrap
        run: |
          tools/build-self-hosted-current.sh \
            build/bootstrap-ablac build/release/${{ matrix.asset }}
      - name: Rebuild with the tagged compiler's own code generator
        run: |
          tools/build-self-hosted-current.sh \
            build/release/${{ matrix.asset }} build/release/fixed-compiler
          mv build/release/fixed-compiler build/release/${{ matrix.asset }}
          # Linux release builds hand opt bitcode and keep no text module.
          if [[ -s build/release/fixed-compiler.ll ]]; then
            mv build/release/fixed-compiler.ll build/release/${{ matrix.asset }}.ll
          fi
      - if: matrix.platform == 'macos'
        name: Exercise native macOS functionality
        run: tools/test-macos-host.sh build/release/${{ matrix.asset }}
      - name: Verify the foreign C ABI
        run: |
          if [[ '${{ matrix.platform }}' == linux ]]; then
            nix-shell shell.nix --run 'tools/test-checked-export.sh build/release/${{ matrix.asset }}'
          else
            tools/test-checked-export.sh build/release/${{ matrix.asset }}
          fi
      - name: Verify cross-target build determinism
        run: |
          if [[ '${{ matrix.platform }}' == linux ]]; then
            nix-shell shell.nix --run 'tools/test-build-same-process.sh build/release/${{ matrix.asset }}'
          else
            tools/test-build-same-process.sh build/release/${{ matrix.asset }}
          fi
      - name: Verify the compiler self-rebuild
        run: |
          tools/test-pure-self-rebuild.sh build/release/${{ matrix.asset }}
      - if: matrix.platform == 'linux'
        name: Verify the compiler rebuilds byte for byte elsewhere
        run: |
          tools/test-reproducible-elsewhere.sh --self build/release/${{ matrix.asset }}
      - name: Verify math has no libm dependency
        run: |
          if [[ '${{ matrix.platform }}' == linux ]]; then
            nix-shell shell.nix --run 'tools/test-math-no-libm.sh build/release/${{ matrix.asset }}'
          else
            tools/test-math-no-libm.sh build/release/${{ matrix.asset }}
          fi
      - if: matrix.platform == 'linux'
        name: Verify the Xtensa LLVM
        run: |
          nix-shell shell.nix --run 'tools/test-llvm-xtensa.sh build/release/${{ matrix.asset }}'
      # #806 step C: the statically linked compiler (no loader, no C library) is built and checked next to the dynamic one, which stays the
      # default. It is an extra asset; tools/release-check.sh checks it (PT_INTERP, DT_NEEDED, smoke compile, fixpoint) when it is present.
      - if: matrix.platform == 'linux'
        name: Build and check the static compiler
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ABLA_NATIVE_JOBS: '4'
        run: |
          nix-shell shell.nix --run '
            set -euo pipefail
            eval "$(tools/static-llvm-env.sh)"
            tools/build-static-compiler.sh build/release/${{ matrix.asset }} build/release/ablac-static-x86_64-linux
            tools/test-static-artifact.sh build/release/ablac-static-x86_64-linux "${RELEASE_TAG#v}"
          '
          (cd build/release && sha256sum ablac-static-x86_64-linux > ablac-static-x86_64-linux.sha256)
      # The same compiler for AArch64 Linux (ablac-static-aarch64-linux), cross-built by this release's compiler on the AArch64 LLVM archives, libstdc++.a,
      # libz.a and libgcc.a of nixpkgs' native aarch64-linux packages (nix/aarch64-static-native-deps.nix: cache.nixos.org has them built, a download).
      # It is checked under qemu-aarch64 (no PT_INTERP, no DT_NEEDED, --version, a smoke compile and run; no fixpoint under emulation) and shipped with
      # its checksum.
      - if: matrix.platform == 'linux'
        name: Build and check the static compiler for AArch64 Linux
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ABLA_NATIVE_JOBS: '4'
        run: |
          nix-shell shell.nix --run '
            set -euo pipefail
            deps=$(nix-build --no-out-link nix/aarch64-static-native-deps.nix)
            export ABLA_STATIC_LLVM_LIB="$deps/llvm" ABLA_STATIC_TARGET_LIBS="$deps/libs" ABLA_STATIC_TARGET=aarch64-linux
            export ABLA_STATIC_LLD_LIB="$deps/lld" ABLA_STATIC_LLD_INCLUDE="$deps/include/lld-only" ABLA_STATIC_LLVM_INCLUDE="$deps/include/llvm" ABLA_STATIC_CXX=clang++ ABLA_STATIC_CXXFLAGS="$(cat "$deps/cxx-flags")"
            tools/build-static-compiler.sh build/release/${{ matrix.asset }} build/release/ablac-static-aarch64-linux
            tools/test-static-artifact.sh build/release/ablac-static-aarch64-linux "${RELEASE_TAG#v}"
          '
          (cd build/release && sha256sum ablac-static-aarch64-linux > ablac-static-aarch64-linux.sha256)
      - name: Verify and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ matrix.platform }}" == linux ]]; then
            version=$(nix-shell shell.nix --run \
              "build/release/${{ matrix.asset }} --version")
          else
            version=$(build/release/${{ matrix.asset }} --version)
          fi
          test "$version" = "ablac ${RELEASE_TAG#v}"
          printf '%s\n' "$version"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd build/release && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          else
            (cd build/release && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi
      - if: matrix.platform == 'linux'
        name: Package the dynamic Linux toolchain (the extra asset of one release; the static package is the default)
        run: |
          docker run --rm \
            -v "$PWD:/abla" \
            ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f \
            bash -ceu '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                binaryen ca-certificates curl libssl3 libssl-dev libzstd1 patchelf xz-utils zlib1g
              llvm_root=$(/abla/tools/install-portable-linux-llvm.sh "$(mktemp -d)")
              export ABLA_PORTABLE_LLVM_ROOT="$llvm_root"
              export PATH="$llvm_root/bin:$PATH" LD_LIBRARY_PATH="$llvm_root/lib"
              /abla/tools/package-linux-toolchain.sh \
                /abla/build/release/ablac-x86_64-linux \
                /abla \
                /abla/build/release/abla-toolchain-dynamic-x86_64-linux.tar.gz
            '
      - if: matrix.platform == 'macos'
        name: Package the macOS toolchain
        run: |
          tools/package-macos-toolchain.sh \
            '${{ matrix.architecture }}' \
            'build/release/${{ matrix.asset }}' \
            . \
            'build/release/abla-toolchain-${{ matrix.architecture }}-macos.tar.gz'
      - name: Exercise the packaged toolchain
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          archive="build/release/abla-toolchain-${{ matrix.architecture }}-${{ matrix.platform }}.tar.gz"
          # On Linux this step exercises the dynamic toolchain archive (the default archive is the static package, checked by its own steps).
          if [[ '${{ matrix.platform }}' == linux ]]; then archive=build/release/abla-toolchain-dynamic-x86_64-linux.tar.gz; fi
          install_root="$RUNNER_TEMP/abla-toolchain"
          mkdir -p "$install_root" "$RUNNER_TEMP/abla-smoke"
          tar -xzf "$archive" -C "$install_root" --strip-components=1
          if [[ '${{ matrix.platform }}' == linux ]]; then
            dependencies=$(ldd "$install_root/libexec/ablac.bin")
            printf '%s\n' "$dependencies"
            if grep -q 'not found' <<< "$dependencies"; then exit 1; fi
            grep -F "libLLVM.so.23.1 => $install_root/libexec/../lib/libLLVM.so.23.1" <<< "$dependencies"
            tools/test-external-llvm-fdiv.sh "$install_root/bin"
            # No external LLVM tools: the archive must supply all of them.
            export PATH="$install_root/bin:/usr/bin:/bin"
          fi
          if [[ '${{ matrix.platform }}' == macos ]]; then
            dependencies=$(otool -L "$install_root/libexec/ablac.bin")
            printf '%s\n' "$dependencies"
            grep -E '@loader_path/../llvm/lib/libLLVM[^ ]*' <<< "$dependencies"
            unset ABLA_LLVM ABLA_LLD ABLA_LLVM_TOOLS ABLA_MACOS_CLANG ABLA_MACOS_LLVM_LIB
            # The launcher finds the LLVM its compiler links, so PATH holds no
            # LLVM: only the system's tools and binaryen's.
            export PATH="$install_root/bin:$(brew --prefix binaryen)/bin:/usr/bin:/bin"
          fi
          test "$(ablac --version)" = "ablac ${RELEASE_TAG#v}"
          "$install_root/bin/abla-install-xtensa" --help
          printf 'fun main: int = 0\n' > "$RUNNER_TEMP/abla-smoke/main.ab"
          (cd "$RUNNER_TEMP/abla-smoke" && ablac build main.ab -o hello)
          "$RUNNER_TEMP/abla-smoke/hello"
          # A link to the launcher from another bin directory finds the toolchain.
          mkdir -p "$RUNNER_TEMP/abla-link"
          ln -s "$install_root/bin/ablac" "$RUNNER_TEMP/abla-link/ablac"
          (cd "$RUNNER_TEMP/abla-smoke" &&
            "$RUNNER_TEMP/abla-link/ablac" build main.ab -o linked-hello)
          "$RUNNER_TEMP/abla-smoke/linked-hello"
          if [[ '${{ matrix.platform }}' == linux ]]; then
            # On a machine with no C development files the archive alone builds a
            # program that brings no C library (#806).
            tools/test-toolchain-without-c-development.sh "$install_root"
            # The runner's glibc is newer than the documented floor: read the archive's files, and run it in
            # the oldest systems the README names (Ubuntu 22.04, AlmaLinux 9).
            tools/test-linux-toolchain-portability.sh "$install_root"
          fi
      - name: Install the Xtensa companion into the packaged toolchain and build for Xtensa
        run: |
          # The release is what users install: its own installer must fetch the published companion, and the packaged
          # compiler must then build the same Xtensa objects as the reference (Nix) cohort. macOS has no Nix cohort.
          install_root="$RUNNER_TEMP/abla-toolchain"
          out="$RUNNER_TEMP/xtensa-release"
          if [[ '${{ matrix.platform }}' == linux ]]; then
            nix-shell shell.nix --run \
              "tools/test-release-xtensa.sh '$install_root' \"\$ABLA_XTENSA_LLVM_ROOT\" '$out'"
          else
            tools/test-release-xtensa.sh "$install_root" '' "$out"
          fi
      # Decision #90 (A): the static compiler is the `ablac-x86_64-linux` asset, the dynamic one (the toolchain archive above is packaged from it,
      # with its libLLVM) `ablac-dynamic-x86_64-linux`, for one release (compile-time nativeLibraries/dlopen need it). Everything above judged the
      # dynamic binary under its old name; the rename is last. tools/release-check.sh compares the dynamic asset with stage 2 and the default
      # asset with its static fixpoint.
      - if: matrix.platform == 'linux'
        name: The static compiler becomes the ablac-x86_64-linux asset
        run: |
          cd build/release
          mv ablac-x86_64-linux ablac-dynamic-x86_64-linux
          if [[ -f ablac-x86_64-linux.ll ]]; then mv ablac-x86_64-linux.ll ablac-dynamic-x86_64-linux.ll; fi
          mv ablac-static-x86_64-linux ablac-x86_64-linux
          rm -f ablac-x86_64-linux.sha256 ablac-static-x86_64-linux.sha256
          sha256sum ablac-dynamic-x86_64-linux > ablac-dynamic-x86_64-linux.sha256
          sha256sum ablac-x86_64-linux > ablac-x86_64-linux.sha256
          git rev-parse HEAD > static-suite-source.sha
      # The same switch for the toolchain archive: `abla-toolchain-x86_64-linux` is the static package (the static compiler with lld in its process, its own
      # code generation, the standard library, runtime and compiler-rt builtins, no libLLVM.so, no clang, no C library: tools/package-linux-static-toolchain.sh),
      # the dynamic archive above (apt's LLVM in an Ubuntu 22.04 container, for its glibc floor) `abla-toolchain-dynamic-x86_64-linux`, for one release.
      # tools/test-package-static.sh builds it from the default asset (build/package-static/package.tar.gz is the asset) and unpacks, builds, runs and rebuilds a program with an empty PATH; the Xtensa
      # companion must install into it and build the reference objects too. tools/release-check.sh judges it (check 8).
      - if: matrix.platform == 'linux'
        name: Package and check the static toolchain (the abla-toolchain-x86_64-linux asset)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ABLA_PACKAGE_NAME: abla-toolchain-x86_64-linux
        run: |
          nix-shell shell.nix --run '
            set -euo pipefail
            tools/test-package-static.sh build/release/ablac-x86_64-linux
            cp build/package-static/package.tar.gz build/release/abla-toolchain-x86_64-linux.tar.gz
            (cd build/release && sha256sum abla-toolchain-x86_64-linux.tar.gz > abla-toolchain-x86_64-linux.tar.gz.sha256)
            install_root="$RUNNER_TEMP/abla-toolchain-static"
            mkdir -p "$install_root"
            tar -xzf build/release/abla-toolchain-x86_64-linux.tar.gz -C "$install_root" --strip-components=1
            test "$(env -i PATH=/nonexistent "$install_root/bin/ablac" --version)" = "ablac ${RELEASE_TAG#v}"
            tools/test-release-xtensa.sh "$install_root" "$ABLA_XTENSA_LLVM_ROOT" "$RUNNER_TEMP/xtensa-release-static"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            build/release/${{ matrix.asset }}
            build/release/${{ matrix.asset }}.sha256
            build/release/static-suite-source.sha
            build/release/ablac-dynamic-x86_64-linux
            build/release/ablac-dynamic-x86_64-linux.sha256
            build/release/ablac-static-aarch64-linux
            build/release/ablac-static-aarch64-linux.sha256
            build/release/abla-toolchain-${{ matrix.architecture }}-${{ matrix.platform }}.tar.gz
            build/release/abla-toolchain-${{ matrix.architecture }}-${{ matrix.platform }}.tar.gz.sha256
            build/release/abla-toolchain-dynamic-x86_64-linux.tar.gz
            build/release/abla-toolchain-dynamic-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  static-suite:
    needs: compiler
    uses: ./.github/workflows/static-suite.yml
    with:
      artifact: ablac-x86_64-linux
      release_mode: true

  publish:
    if: ${{ inputs.publish_release }}
    needs: [compiler, static-suite]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: ablac-*
          path: release
          merge-multiple: true
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          test "$(cat release/static-suite-source.sha)" = "$(git rev-parse HEAD)"
          (cd release && sha256sum -c ablac-x86_64-linux.sha256)
          rm release/static-suite-source.sha
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            for bridge in \
              ablac-x86_64-linux.bridge \
              ablac-x86_64-linux.bridge.sha256 \
              ablac-x86_64-macos.o \
              ablac-x86_64-macos.o.sha256 \
              ablac-arm64-macos.o \
              ablac-arm64-macos.o.sha256
            do
              gh release delete-asset "$RELEASE_TAG" "$bridge" --yes \
                >/dev/null 2>&1 || true
            done
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --verify-tag --title "Abla ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "Abla ${RELEASE_TAG#v}"
          fi
