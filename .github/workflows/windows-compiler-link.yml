# Produce a real Windows compiler for local Wine validation, or, with crt_inventory, measure the C runtime it links
# (docs/design/windows-crt-free-compiler.md: a link map, the CRT archive members and leave-one-out links; ablac.exe itself
# is linked as without it).
name: Windows compiler link

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'x64 (windows-latest) or arm64 (windows-11-arm)'
        type: choice
        options: [x64, arm64]
        default: x64
      crt_inventory:
        description: 'Also run the C runtime inventory links and upload their map, logs and summary'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cross-compile:
    name: Compile the Windows compiler object on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ABLA_NATIVE_JOBS: '4'
      ABLA_CODEGEN_JOBS: '4'
      ABLA_RELEASE_SELFHOST_BUILD_SECONDS: '1200'
      TARGET: ${{ inputs.architecture == 'arm64' && 'aarch64-windows' || 'x86_64-windows-hosted' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Build the bootstrap compiler and emit the Windows COFF object
        run: |
          nix-shell shell.nix --run 'make ablac'
          nix-shell shell.nix --run 'tools/windows/cross-compiler-object.sh build/ablac src/orc_windows_main.ab build/windows-compiler-coff "$TARGET"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-compiler-coff
          path: |
            build/windows-compiler-coff/ablac.exe.o
            build/windows-compiler-coff/ablac.exe.imports/
          if-no-files-found: error
          retention-days: 3

  link:
    name: Link the Windows compiler with its static LLVM SDK
    needs: cross-compile
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 40
    env:
      ARCHITECTURE: ${{ inputs.architecture }}
      CRT_INVENTORY: ${{ inputs.crt_inventory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: windows-compiler-coff
          path: build/windows-compiler-coff
      - name: Install the verified Windows LLVM SDK
        shell: pwsh
        run: ./tools/windows/install-static-llvm.ps1 -Destination build/llvm -Architecture $env:ARCHITECTURE
      - name: Link ablac.exe
        shell: pwsh
        run: |
          $inventory = $env:CRT_INVENTORY -eq 'true'
          ./tools/windows/build-static-compiler.ps1 `
            -CompilerObject build/windows-compiler-coff/ablac.exe.o `
            -ImportDirectory build/windows-compiler-coff/ablac.exe.imports `
            -LlvmRoot build/llvm -BuildDirectory build/windows-compiler -Architecture $env:ARCHITECTURE `
            -CrtInventory:$inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-compiler-${{ inputs.architecture }}
          path: build/windows-compiler/ablac.exe
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.crt_inventory }}
        with:
          name: windows-compiler-crt-inventory-${{ inputs.architecture }}
          path: build/windows-compiler/crt-inventory/
          if-no-files-found: error
          retention-days: 30
